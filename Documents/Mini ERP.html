<style>
/* Layout: thanh điều hướng tối bên trái, vùng làm việc dày thông tin bên phải; bảng và thanh trạng thái là thành phần chính */
:root{
  --bg:#EDEFF2; --surface:#FFFFFF; --surface-2:#F4F5F8; --line:#DADEE5;
  --ink:#14181F; --ink-2:#48515E; --ink-3:#778090;

  --good:#17804F; --good-soft:#DDF3E8; --warn:#9A6700; --warn-soft:#FFF0C7;
  --bad:#C62828; --bad-soft:#FBE0DE; --info:#2257C5; --info-soft:#E1EAFB;
  --seg-issued:#1F2A3A; --seg-res:#4A7BD6; --seg-po:#E8A317; --seg-short:#D64545;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(15,20,30,.06),0 4px 14px rgba(15,20,30,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --surface-2:#1E232C; --line:#2A313C;
  --ink:#E9ECF1; --ink-2:#A9B1BE; --ink-3:#7B8595;
  --accent:#FF7A45; --accent-ink:#1A0E08; --accent-soft:#3B2316;
  --side:#0A0C10; --side-ink:#9AA3B2; --side-line:#1B2029; --side-on:#FFFFFF;
  --good:#3FCB8A; --good-soft:#12301F; --warn:#F0B84A; --warn-soft:#3A2D0B;
  --bad:#FF6B63; --bad-soft:#3C1816; --info:#7BA5FF; --info-soft:#14233F;
  --seg-issued:#8FA3C2; --seg-res:#5B8DEF; --seg-po:#E8A317; --seg-short:#FF6B63;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface-2:#1E232C; --line:#2A313C;
  --ink:#E9ECF1; --ink-2:#A9B1BE; --ink-3:#7B8595;
  --accent:#FF7A45; --accent-ink:#1A0E08; --accent-soft:#3B2316;
  --side:#0A0C10; --side-ink:#9AA3B2; --side-line:#1B2029; --side-on:#FFFFFF;
  --good:#3FCB8A; --good-soft:#12301F; --warn:#F0B84A; --warn-soft:#3A2D0B;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:13.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums;text-align:right}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%}
#side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:16px 16px 14px;border-bottom:1px solid var(--side-line)}
.brand-mark{width:30px;height:30px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-mark svg{width:18px;height:18px;stroke:var(--accent-ink)}
.brand b{display:block;color:var(--side-on);font-size:14px;letter-spacing:.01em}
.brand small{font-size:11px;color:var(--side-ink)}
.nav{display:flex;flex-direction:column;gap:2px;padding:10px 8px}
.nav-h{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#6C7686;padding:12px 10px 4px}
.nav button{display:flex;align-items:center;gap:10px;background:none;border:0;border-radius:6px;padding:8px 10px;color:var(--side-ink);cursor:pointer;text-align:left;width:100%}
.nav button svg{width:17px;height:17px;flex:none;stroke:currentColor}
.nav button:hover{background:var(--side-line);color:var(--side-on)}
.nav button[aria-current="page"]{background:var(--side-line);color:var(--side-on);box-shadow:inset 3px 0 0 var(--accent)}
.nav .badge{margin-left:auto;font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:0 7px;font-weight:600}
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--side-line);font-size:11px;color:#6C7686}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.top h1{font-size:16px}
.top .grow{flex:1}
.crumb{font-size:12px;color:var(--ink-3)}
.sel,.inp,.txt{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;min-width:0}
.inp,.txt,.sel{width:100%}
.top .sel{width:auto}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn svg{width:15px;height:15px;stroke:currentColor}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--bad)}
.icon-btn{width:34px;height:34px;padding:0;justify-content:center}
.ai-btn{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.ai-btn:hover{background:var(--ink);filter:brightness(1.15)}
.av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}

#view{padding:18px 20px 40px;overflow:auto;flex:1;min-height:0}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}
.row>.grow{flex:1 1 360px;min-width:0}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h h2{font-size:13.5px}
.card-h .sp{flex:1}
.card-b{padding:14px}
.kpi{padding:13px 14px;display:flex;flex-direction:column;gap:2px}
.kpi small{color:var(--ink-3);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}
.kpi strong{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--ink-2)}
.kpi.bad{border-color:var(--bad)} .kpi.bad strong{color:var(--bad)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:0 6px;font-size:11.5px;color:var(--ink-2);background:var(--surface-2)}
.tagp{font-family:var(--mono);font-size:11px}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer} tbody tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.soon td:first-child{box-shadow:inset 3px 0 0 var(--seg-po)}
.prog{height:6px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--accent)}
.prog.good i{background:var(--good)} .prog.bad i{background:var(--bad)} .prog.warn i{background:var(--seg-po)}
.seg{display:flex;height:10px;border-radius:2px;overflow:hidden;background:repeating-linear-gradient(45deg,var(--line) 0 3px,transparent 3px 6px);min-width:140px}
.seg i{display:block;height:100%}
.seg .s1{background:var(--seg-issued)} .seg .s2{background:var(--seg-res)} .seg .s3{background:var(--seg-po)} .seg .s4{background:var(--seg-short)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.alert-item{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line)}
.alert-item:last-child{border-bottom:0}
.alert-item .dot{width:8px;height:8px;border-radius:50%;margin-top:7px;flex:none}
.alert-item p{margin:2px 0 0;color:var(--ink-2);font-size:12.5px}
.alert-item .acts{margin-top:7px;display:flex;gap:6px;flex-wrap:wrap}
.proj-pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:10px}
.proj-pick button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:5px}
.proj-pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.proj-pick .nm{font-weight:600;line-height:1.3}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px 18px}
.kv div small{display:block;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.kv div b{font-weight:500}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:500}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px}
.form .full{grid-column:1/-1}
.steps{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);flex-wrap:wrap}
.steps b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);font-size:10.5px;font-weight:600}
.steps .on b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.steps .done b{background:var(--good);border-color:var(--good);color:#fff}
.steps .on{color:var(--ink)} .steps .done{color:var(--ink-2)}
.steps hr{width:14px;border:0;border-top:1px solid var(--line);margin:0}
.gantt{position:relative}
.g-head,.g-row{display:grid;grid-template-columns:minmax(190px,260px) minmax(420px,1fr);align-items:center}
.g-head{font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--line);background:var(--surface-2)}
.g-head>div,.g-row>div{padding:8px 12px}
.g-row{border-bottom:1px solid var(--line)}
.g-row:last-child{border-bottom:0}
.g-track{position:relative;height:30px}
.g-track::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(100%/11 - 1px),var(--line) calc(100%/11 - 1px) calc(100%/11))}
.g-bar{position:absolute;top:9px;height:12px;border-radius:3px;background:var(--seg-res)}
.g-bar.late{background:var(--seg-short)} .g-bar.soon{background:var(--seg-po)} .g-bar.done{background:var(--good)}
.g-need{position:absolute;top:3px;bottom:3px;width:0;border-left:2px dashed var(--ink)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:2}
.g-months{display:flex}
.g-months span{text-align:left}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:260px}
.col-h{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600}
.col-h .ct{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}
.col-b{display:flex;flex-direction:column;gap:8px;padding:0 8px 10px;flex:1}
.col.over{outline:2px dashed var(--accent);outline-offset:-4px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:9px 10px;cursor:grab;display:flex;flex-direction:column;gap:7px;box-shadow:var(--shadow)}
.tk.drag{opacity:.4}
.tk b{font-weight:500;line-height:1.35}
.tk .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.tk .meta .av{width:22px;height:22px;font-size:10px}
.tk .mv{margin-left:auto;display:flex;gap:3px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cal .dh{padding:6px 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);background:var(--surface-2);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cal .dc{min-height:92px;padding:4px 5px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .dc.off{background:var(--surface-2)}
.cal .dc.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .dn{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.ev{font-size:11px;line-height:1.25;border-radius:3px;padding:2px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--accent-soft);color:var(--accent)}
.ev.eta{background:var(--info-soft);color:var(--info)} .ev.pay{background:var(--good-soft);color:var(--good)}
.ev.dl{background:var(--bad-soft);color:var(--bad)} .ev.trip{background:var(--warn-soft);color:var(--warn)}
.scan{display:flex;gap:8px}
.scan .inp{font-family:var(--mono)}
.empty{padding:26px;text-align:center;color:var(--ink-3)}
.msg-ok{color:var(--good)} .msg-bad{color:var(--bad)}
.note{font-size:12px;color:var(--ink-3)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--info);border-radius:6px;padding:9px 12px;font-size:12.5px}
.banner svg{width:16px;height:16px;stroke:currentColor;flex:none;margin-top:2px}

.overlay{position:fixed;inset:0;background:rgba(8,10,14,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:10px;border:1px solid var(--line);width:min(440px,100%);max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.modal-h{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);gap:8px}
.modal-h h2{flex:1;font-size:14px}
.modal-b{padding:16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.qr{width:208px;height:208px;background:#fff;padding:8px;border-radius:6px;border:1px solid var(--line)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:40;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.drawer-h h2{flex:1;font-size:14px}
.chat{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.bub{max-width:92%;padding:8px 11px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.bub.me{align-self:flex-end;background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.bub ul{margin:4px 0 0;padding-left:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 10px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chips button:hover{border-color:var(--accent);color:var(--accent)}
.chat-in{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;z-index:70;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.load{display:flex;align-items:center;gap:8px}
.load .prog{flex:1}

@media (max-width:900px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #side{flex-direction:row;overflow-x:auto;overflow-y:hidden;align-items:center}
  .brand{border:0;padding:10px 12px;flex:none}.brand small{display:none}
  .nav{flex-direction:row;padding:6px 8px;flex:none}.nav-h,.side-foot{display:none}
  .nav button{padding:7px 10px;white-space:nowrap;width:auto}
  .nav button[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--accent)}
  .top{padding:10px 16px}#view{padding:14px 16px 40px}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:0}}}
</style>

/* ============ ALERT ENGINE (mô phỏng AI Agent) ============ */
function alerts(){
  const out=[];
  BOM.forEach(b=>{const d=lateDays(b);
    if(b.eta&&d>0)out.push({sev:'bad',proj:'DA-2609-01',title:`${b.name} về trễ ${d} ngày`,txt:`ETA ${dmy(b.eta)} sau ngày cần lắp ${dmy(b.needDate)} (${b.po_no}). Đề nghị đổi NCC hoặc đẩy lịch lắp module liên quan.`,go:'procurement'});});
  BOM.forEach(b=>{if(short_(b)>0)out.push({sev:'warn',proj:'DA-2609-01',title:`${b.name}: thiếu ${short_(b)} ${b.unit}, chưa có PO`,txt:`Đã tạo ${b.pr||'PR'} từ BOM, đang chờ Mua hàng xử lý. Cần lắp ngày ${dmy(b.needDate)}.`,go:'procurement'});});
  const st=STOCK.find(s=>s.sku==='CYL-CDQ2B32-50');
  out.push({sev:'warn',proj:'DA-2608-02',title:'Xylanh SMC: tồn khả dụng bằng 0',txt:'Toàn bộ 9 cái đã giữ chỗ cho 2 dự án. Dự án mới sẽ phải mua thêm.',go:'inventory'});
  const khoa=EMP.find(e=>e.id==='NV031');
  out.push({sev:'info',proj:'',title:'Chứng chỉ hàn 6G của Đặng Văn Khoa hết hạn sau '+diff(TODAY,khoa.cert.exp)+' ngày',txt:'Khoa đang được giao 2 task hàn. Nên sắp xếp thi lại trước 02/11.',go:'hr'});
  return out;
}

  <nav class="nav">${NAV.map(([k,l])=>k==='_'?`<div class="nav-h">${l}</div>`:`<button data-go="${k}" ${S.view===k?'aria-current="page"':''}>${ic(k)}<span>${l}</span>${k==='requests'&&pending?`<span class="badge">${pending}</span>`:''}</button>`).join('')}</nav>

  $('#side').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

function renderTop(){
  $('#top').innerHTML=`<div><div class="crumb">Hôm nay ${dmy(TODAY)}</div><h1>${TITLES[S.view]}</h1></div><div class="grow"></div>
  <label class="muted" for="roleSel" style="font-size:12px">Đang xem với vai trò</label>

  <button class="btn ai-btn" id="aiBtn">${ic('spark')} Trợ lý AI</button>

  $('#aiBtn').onclick=()=>{S.aiOpen=true;renderLayer()};
  $('#themeBtn').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
}
function go(v){S.view=v;try{history.replaceState(null,'','#'+v)}catch(e){}renderSide();renderTop();renderView();$('#view').scrollTop=0}
function renderView(){$('#view').innerHTML=VIEWS[S.view]();bind[S.view]&&bind[S.view]()}
function tabs(id,list,cur){return `<div class="tabs" role="tablist">${list.map(([k,l])=>`<button role="tab" data-tab="${id}:${k}" aria-selected="${cur===k}">${l}</button>`).join('')}</div>`}
function bindTabs(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{const [id,k]=b.dataset.tab.split(':');S[id]=k;renderView()})}
function projPick(){return `<div class="proj-pick">${PROJECTS.map(p=>{const g=progOf(p.id);return `<button data-pp="${p.id}" aria-pressed="${S.proj===p.id}"><span class="tagp muted">${p.id}</span><span class="nm">${p.name}</span><span class="note">${p.cust} · hạn ${dm(p.due)}</span><span class="load"><span class="prog"><i style="width:${g}%"></i></span><b class="mono">${g}%</b></span></button>`}).join('')}</div>`}
function bindPP(){document.querySelectorAll('[data-pp]').forEach(b=>b.onclick=()=>{S.proj=b.dataset.pp;renderView()})}

/* ---- Dự án & BOM ---- */
const bomState=b=>{const d=lateDays(b);
  if(b.issued>=b.need)return pill('Đã xuất đủ','good');
  if(d>0)return pill('Trễ ETA '+d+' ngày','bad');
  if(short_(b)>0&&b.po===0)return pill('Thiếu · '+(b.pr||'PR'),'warn');
  if(b.po>0)return pill('Đang đặt mua','info');
  return pill('Đã giữ chỗ','good')};
function costOf(pid){
  if(pid!=='DA-2609-01'){const p=P(pid);const g=progOf(pid)/100;const used=p.budget*(.08+.62*g);return{mat:used*.82,commit:p.budget*.14,ot:used*.11,trip:used*.07,budget:p.budget}}
  const mat=BOM.reduce((s,b)=>s+b.issued*b.cost,0)+412000000;
  const commit=BOM.reduce((s,b)=>s+(b.res+b.po)*b.cost,0)+318000000;
  return{mat,commit,ot:5400000,trip:3200000,budget:P(pid).budget}}
VIEWS.projects=()=>{
  const p=P(S.proj);const g=progOf(p.id);
  let body='';
  if(S.ptab==='info')body=`<div class="card-b"><div class="kv">
    <div><small>Mã dự án</small><b class="mono">${p.id}</b></div><div><small>Khách hàng</small><b>${p.cust}</b></div>

    <div><small>Ngân sách giá thành</small><b>${vnd(p.budget)}</b></div><div><small>Tiến độ (từ task)</small><b>${g}%</b></div></div></div>`;
  if(S.ptab==='bom'){
    const bs=p.id==='DA-2609-01'?BOM:[];
    body=bs.length?`<div class="card-b" style="display:flex;flex-direction:column;gap:12px"><div class="legend" style="--x:0">
      <span style="--c:var(--seg-issued)">Đã xuất cho dự án</span><span style="--c:var(--seg-res)">Tồn kho giữ chỗ</span><span style="--c:var(--seg-po)">Đang đặt mua (PO)</span><span style="--c:var(--seg-short)">Thiếu, cần PR</span></div></div>

    ${bs.map(b=>{const sh=short_(b),pc=x=>(100*x/b.need).toFixed(1);const late=lateDays(b)>0;return `<tr class="${late?'late':''}"><td><b>${b.name}</b><div class="note mono">${b.sku}</div></td><td class="num">${b.need}</td>
      <td><div class="seg" title="Đã xuất ${b.issued} · Giữ ${b.res} · PO ${b.po} · Thiếu ${sh}"><i class="s1" style="width:${pc(b.issued)}%"></i><i class="s2" style="width:${pc(b.res)}%"></i><i class="s3" style="width:${pc(b.po)}%"></i><i class="s4" style="width:${pc(sh)}%"></i></div></td>
      <td class="num">${b.issued}</td><td class="num">${b.res}</td><td class="num">${b.po}</td><td class="num ${sh?'msg-bad':''}"><b>${sh}</b></td><td>${dm(b.needDate)}</td><td>${bomState(b)}</td></tr>`}).join('')}</tbody></table></div>
    <div class="card-b" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)"><button class="btn" data-act="import">${ic('plus')} Nhập BOM từ file</button><button class="btn" data-act="ai-bom">${ic('spark')} Bóc tách BOM bằng AI</button><button class="btn" data-act="recheck">Đối soát lại với kho</button><span class="note">Hiển thị 8 / 146 dòng của BOM này</span></div>`
    :`<div class="empty">BOM của ${p.id} chưa được nhập.<br><button class="btn primary" style="margin-top:10px" data-act="import">${ic('plus')} Nhập BOM</button></div>`}
  if(S.ptab==='task'){const ts=TASKS.filter(t=>t.p===p.id);body=`<div class="scroll-x"><table><thead><tr><th>Công đoạn</th><th>Loại</th><th>Phụ trách</th><th>Hạn</th><th>Trạng thái</th></tr></thead><tbody>${ts.map(t=>`<tr><td><b>${t.t}</b></td><td><span class="tag">${t.ty}</span></td><td>${t.who}</td><td>${dm(t.due)}</td><td>${colPill(t.col)}</td></tr>`).join('')}</tbody></table></div>`}
  if(S.ptab==='pay'){body=payTable(p.id)}
  if(S.ptab==='cost'){const c=costOf(p.id);const tot=c.mat+c.ot+c.trip;const pc=x=>(100*x/c.budget).toFixed(1);
    body=`<div class="card-b stack"><div class="grid4">
      <div class="card kpi"><small>Vật tư đã xuất</small><strong>${short(c.mat)}</strong><span>Giá bình quân gia quyền</span></div>
      <div class="card kpi"><small>Nhân công OT</small><strong>${short(c.ot)}</strong><span>Từ đơn OT đã duyệt</span></div>
      <div class="card kpi"><small>Công tác & trợ cấp</small><strong>${short(c.trip)}</strong><span>Từ báo cáo công tác</span></div>
      <div class="card kpi"><small>Cam kết chưa xuất</small><strong>${short(c.commit)}</strong><span>Giữ chỗ + PO đang chạy</span></div></div>
      <div><div class="seg" style="height:16px"><i class="s1" style="width:${pc(c.mat)}%"></i><i class="s3" style="width:${pc(c.ot+c.trip)}%"></i><i class="s2" style="width:${pc(c.commit)}%"></i></div>
      <div class="legend" style="margin-top:8px"><span style="--c:var(--seg-issued)">Vật tư đã xuất</span><span style="--c:var(--seg-po)">OT + trợ cấp</span><span style="--c:var(--seg-res)">Cam kết</span></div></div>
      <div class="banner">${ic('info')}<div>Giá thành thực tế <b>${vnd(tot)}</b>, cộng cam kết là <b>${vnd(tot+c.commit)}</b> trên ngân sách ${vnd(c.budget)} (${Math.round(100*(tot+c.commit)/c.budget)}%). Lợi nhuận gộp dự kiến ${vnd(p.value-(tot+c.commit))}.</div></div></div>`}
  return `<div class="stack">${projPick()}
  <section class="card"><div class="card-h"><div><h2>${p.name}</h2><div class="note mono">${p.id} · ${p.cust} · bàn giao ${dmy(p.due)}</div></div><span class="sp"></span><button class="btn" data-act="newproj">${ic('plus')} Dự án mới</button></div>
  ${tabs('ptab',[['bom','BOM & Vật tư'],['task','Công việc'],['pay','Thanh toán'],['cost','Giá thành'],['info','Hồ sơ']],S.ptab)}${body}</section></div>`};

  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
    if(a==='import')toast('Chọn file .xlsx / .csv theo mẫu BOM để nhập');

function payTable(pid){

function bindPay(){document.querySelectorAll('[data-act="qr"]').forEach(b=>b.onclick=()=>openQR(b.dataset.id))}

VIEWS.tasks=()=>{
  const list=TASKS.filter(t=>S.tkProj==='all'||t.p===S.tkProj);
  const sel=`<select class="sel" id="tkP" style="width:auto"><option value="all">Tất cả dự án</option>${PROJECTS.map(p=>`<option value="${p.id}" ${S.tkProj===p.id?'selected':''}>${p.id} · ${p.name}</option>`).join('')}</select>`;
  const g=S.tkProj==='all'?'':` <span class="pill info">Tiến độ ${S.tkProj}: ${progOf(S.tkProj)}%</span>`;
  let body='';
  if(S.tktab==='board'){
    body=`<div class="board">${COLS.map(([k,l])=>{const c=list.filter(t=>t.col===k);return `<div class="col" data-col="${k}"><div class="col-h">${l}<span class="ct">${c.length}</span></div><div class="col-b">${c.map(t=>`<div class="tk" draggable="true" data-id="${t.id}"><b>${t.t}</b><div class="meta"><span class="tag tagp">${t.p}</span><span class="tag">${t.ty}</span></div>
      <div class="meta"><span class="av" title="${t.who}">${initials(t.who)}</span><span class="${t.due<TODAY&&t.col!=='done'?'msg-bad':''}">Hạn ${dm(t.due)}</span><span class="mv">${k!=='wait'?`<button class="btn sm ghost" data-mv="${t.id}:-1" aria-label="Lùi cột">‹</button>`:''}${k!=='done'?`<button class="btn sm ghost" data-mv="${t.id}:1" aria-label="Tiến cột">›</button>`:''}</span></div></div>`).join('')||'<div class="empty note">Kéo thẻ vào đây</div>'}</div></div>`}).join('')}</div>`}
  else body=calendar();
  return `<div class="stack"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${sel}${g}<span class="sp" style="flex:1"></span><button class="btn primary" data-act="newtask">${ic('plus')} Giao việc</button></div>
  <section class="card">${tabs('tktab',[['board','Kanban'],['cal','Lịch tháng 10/2026']],S.tktab)}<div class="card-b">${body}</div></section></div>`};
function calendar(){
  const ev={};const put=(d,t,c)=>{(ev[d]=ev[d]||[]).push({t,c})};
  const pf=id=>S.tkProj==='all'||S.tkProj===id;
  TASKS.filter(t=>pf(t.p)&&t.col!=='done').forEach(t=>put(t.due,`${t.t}`,''));
  BOM.forEach(b=>{if(b.eta&&pf('DA-2609-01'))put(b.eta,'Hàng về: '+b.name.split(' ').slice(0,3).join(' '),'eta')});
  PAYS.filter(x=>!x.paid&&pf(x.p)).forEach(x=>put(x.due,'Thu: '+x.n+' '+x.p.slice(3),'pay'));
  PROJECTS.filter(p=>pf(p.id)).forEach(p=>put(p.due,'Bàn giao '+p.id,'dl'));
  if(pf('DA-2607-04'))for(let d=16;d<=18;d++)put('2026-10-'+d,'Công tác: Tuấn (Cần Thơ)','trip');
  const first=3; /* 01/10/2026 là thứ Năm → lệch 3 ô */
  let cells=['T2','T3','T4','T5','T6','T7','CN'].map(d=>`<div class="dh">${d}</div>`).join('');

bind.inventory=()=>{bindTabs();

/* ---- Tài chính ---- */
function agingBucket(due){const d=diff(due,TODAY);return d<=0?0:d<=30?1:d<=60?2:d<=90?3:4}
const BK=['Chưa đến hạn','1–30 ngày','31–60 ngày','61–90 ngày','Trên 90 ngày'];
function agingTable(rows,key){
  const g={};rows.forEach(r=>{(g[r[key]]=g[r[key]]||[0,0,0,0,0])[agingBucket(r.due)]+=r.amt});
  const tot=[0,0,0,0,0];Object.values(g).forEach(a=>a.forEach((v,i)=>tot[i]+=v));
  return `<div class="scroll-x"><table><thead><tr><th>${key==='cust'?'Khách hàng':'Nhà cung cấp'}</th>${BK.map(b=>`<th class="num">${b}</th>`).join('')}<th class="num">Tổng</th></tr></thead><tbody>
  ${Object.entries(g).map(([n,a])=>`<tr><td><b>${n}</b></td>${a.map((v,i)=>`<td class="num ${i>0&&v?'msg-bad':''}">${v?short(v):'<span class="muted">—</span>'}</td>`).join('')}<td class="num"><b>${short(a.reduce((x,y)=>x+y,0))}</b></td></tr>`).join('')}
  <tr><td><b>Tổng</b></td>${tot.map(v=>`<td class="num"><b>${short(v)}</b></td>`).join('')}<td class="num"><b>${short(tot.reduce((x,y)=>x+y,0))}</b></td></tr></tbody></table></div>`}

/* ============ VIETQR (mô phỏng) ============ */
function fakeQR(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const n=25,cells=[];const r=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;
  const finder=(x,y)=>(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
  const fr=(x,y)=>{const ex=x<7?x:x>=n-7?x-(n-7):x,ey=y<7?y:y>=n-7?y-(n-7):y;return ex===0||ex===6||ey===0||ey===6||(ex>=2&&ex<=4&&ey>=2&&ey<=4)};
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){const on=finder(x,y)?fr(x,y):r()>.52;if(on)cells.push(`<rect x="${x}" y="${y}" width="1" height="1"/>`)}
  return `<svg class="qr" viewBox="-1 -1 ${n+2} ${n+2}" role="img" aria-label="Mã QR minh hoạ"><g fill="#111">${cells.join('')}</g></svg>`}
function openQR(id){const x=PAYS.find(y=>y.id===id);const p=P(x.p);
  $('#layer').insertAdjacentHTML('beforeend',`<div class="overlay" id="qrOv"><div class="modal" role="dialog" aria-modal="true" aria-label="VietQR"><div class="modal-h"><h2>VietQR · ${x.n}</h2><button class="btn icon-btn ghost" data-close aria-label="Đóng">${ic('x')}</button></div><div class="modal-b">
  ${fakeQR(id+p.id)}<div style="text-align:center"><b style="font-size:20px">${vnd(payAmt(x))}</b><div class="note">Nội dung CK: <span class="mono">${p.id.replace(/-/g,'')} ${x.id}</span></div><div class="note">Vietcombank •••• 4821 · CÔNG TY CƠ KHÍ MẪU</div></div>
  <div class="note" style="text-align:center">Hình QR là minh hoạ. Bản thật gọi API VietQR với số tiền và nội dung của đợt này, khách quét là điền sẵn.</div><button class="btn primary" data-copy>Sao chép nội dung chuyển khoản</button></div></div></div>`);
  const ov=$('#qrOv');ov.onclick=e=>{if(e.target===ov||e.target.closest('[data-close]'))ov.remove()};
  ov.querySelector('[data-copy]').onclick=()=>{const t=p.id.replace(/-/g,'')+' '+x.id;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Đã sao chép'),()=>toast('Nội dung: '+t))}}

/* ============ AI PANEL (mô phỏng Gemini) ============ */
function aiReply(k,r){
  if(k==='late'){const l=BOM.filter(b=>lateDays(b)>0);return{t:`Phát hiện <b>${l.length}</b> vật tư có ETA sau ngày cần lắp:<ul>${l.map(b=>`<li>${b.name}: ETA ${dm(b.eta)}, cần ${dm(b.needDate)} → <b class="msg-bad">trễ ${lateDays(b)} ngày</b> (${b.po_no})</li>`).join('')}</ul>Đề xuất: hỏi NCC về giao một phần, hoặc đổi thứ tự lắp để module servo lùi sau 28/10.`}}
  if(k==='week'){const p='DA-2609-01',ts=TASKS.filter(t=>t.p===p);return{t:`<b>${p} · tuần 5–11/10</b><ul><li>Tiến độ ${progOf(p)}%, ${ts.filter(t=>t.col==='qc').length} task chờ QC, ${ts.filter(t=>t.col==='doing').length} đang làm.</li><li>Rủi ro: 2 vật tư trễ ETA, 1 vật tư chưa có PO.</li><li>Nhân sự: Hùng tải ${loadOf('Nguyễn Văn Hùng')}%, nên cân nhắc chuyển 1 task cho Tuấn.</li></ul>`}}
  if(k==='bom')return{t:`Đã đọc file <span class="mono">ZN200_BOM_v3.xlsx</span>, bóc tách <b>5 dòng mẫu</b>:<ul><li>Servo Delta ASD-B3 750W × 6</li><li>Cảm biến Omron E2E-X5ME1 × 24</li><li>Xylanh SMC CDQ2B32-50DZ × 12</li><li>Biến tần Inovance MD500 × 3</li><li>Vòng bi SKF 6205-2RS × 20</li></ul>Khớp mã với danh mục vật tư: 5/5. Người dùng xem lại rồi mới bấm "Nhập vào BOM".`}
  if(k==='plc'){return{t:`Gợi ý cho task Lập trình PLC:<ul>${rankPLC().map(x=>`<li><b>${x.n}</b>: phù hợp ${x.sc}%, tải ${x.l}%</li>`).join('')}</ul>`}}
  if(k==='req')return{t:`Gợi ý nhận xét cho <b>${r.id}</b> (${esc(r.who)}): "Đồng ý. Người bàn giao đã xác nhận, không ảnh hưởng mốc ${r.ty==='leave'?'12–13/10':'dự án'} của DA-2609-01."<br><span class="note">Bạn chỉnh lại trước khi bấm Duyệt.</span>`}
  return{t:'Đây là bản giao diện mẫu nên chỉ trả lời các câu gợi ý bên dưới. Bản thật gọi Gemini qua Apps Script, đọc dữ liệu từ các Sheet.'}}
function renderLayer(){
  const L=$('#layer');L.querySelector('#aiDr')?.remove();
  if(!S.aiOpen)return;
  L.insertAdjacentHTML('beforeend',`<aside class="drawer" id="aiDr" aria-label="Trợ lý AI"><div class="drawer-h">${ic('spark').replace('<svg','<svg style="width:18px;height:18px;stroke:var(--accent)"')}<h2>Trợ lý AI</h2><button class="btn icon-btn ghost" data-x aria-label="Đóng">${ic('x')}</button></div>
  <div class="chat" id="chat">${S.chat.length?S.chat.map(m=>`<div class="bub ${m.me?'me':''}">${m.me?esc(m.t):m.t}</div>`).join(''):`<div class="bub">Xin chào. Tôi theo dõi ETA vật tư, tiến độ dự án và đơn từ. Hỏi tôi hoặc chọn một gợi ý.<br><span class="note">Bản mô phỏng, dữ liệu mẫu.</span></div>`}</div>
  <div class="chips">${[['late','Vật tư nào sắp trễ?'],['week','Tóm tắt tuần DA-2609-01'],['bom','Bóc tách BOM từ file'],['plc','Ai làm PLC được?']].map(([k,l])=>`<button data-q="${k}">${l}</button>`).join('')}</div>
  <form class="chat-in" id="aiForm"><input class="inp" id="aiIn" placeholder="Nhập câu hỏi" aria-label="Câu hỏi cho trợ lý"><button class="btn primary">Gửi</button></form></aside>`);
  const d=$('#aiDr');d.querySelector('[data-x]').onclick=()=>{S.aiOpen=false;renderLayer()};
  d.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.chat.push({me:true,t:b.textContent},aiReply(b.dataset.q));renderLayer()});
  $('#aiForm').onsubmit=e=>{e.preventDefault();const v=$('#aiIn').value.trim();if(!v)return;S.chat.push({me:true,t:v},aiReply(''));renderLayer()};
  const c=$('#chat');c.scrollTop=c.scrollHeight}
