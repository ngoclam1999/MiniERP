<script>
(function(){'use strict';
var previous=route,tasks=[],projects=[],employees=[],auth={},calendarMonth=new Date().toISOString().slice(0,7),calendarEvents=[];
route=function(){var page=(location.hash||'#dashboard').slice(1);if(page==='tasks'){renderTasks();document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active',a.hash==='#tasks')});viewName.textContent='Công việc'}else previous()};addEventListener('hashchange',function(){route()});
function renderTasks(){var view=document.querySelector('main.content');view.dataset.page='tasks';view.innerHTML='<div class="head"><div><h1>Công việc</h1><p>Kanban dự án và lịch vận hành theo tháng.</p></div><button class="btn primary" id="newTask">Giao việc</button></div><div id="taskTabs"></div>';MiniERP.ui.tabs(document.getElementById('taskTabs'),[{id:'kanban',label:'Kanban',content:kanbanShell()},{id:'calendar',label:'Lịch tháng',content:calendarShell()}]);document.getElementById('newTask').onclick=openTaskForm;bindKanban();bindCalendar();loadReferences()}
function kanbanShell(){return'<section class="card component-block"><div class="catalog-toolbar"><div class="field catalog-search"><label for="taskProjectFilter">Dự án</label><select id="taskProjectFilter"><option value="">Tất cả dự án</option></select></div><span class="label">Kéo thả trên máy tính · dùng nút ‹ › trên điện thoại</span></div><div id="taskBoard" class="kanban-board"><div class="sk"></div></div></section>'}
function calendarShell(){return'<section class="card component-block"><div class="calendar-toolbar"><button class="btn icon" id="calendarPrev" aria-label="Tháng trước">‹</button><div class="field"><label for="calendarMonth">Tháng</label><input id="calendarMonth" type="month" value="'+calendarMonth+'"></div><div class="field"><label for="calendarProject">Dự án</label><select id="calendarProject"><option value="">Tất cả dự án</option></select></div><button class="btn icon" id="calendarNext" aria-label="Tháng sau">›</button></div><div class="calendar-legend"><span data-tone="task">Hạn task</span><span data-tone="eta">Hàng về</span><span data-tone="payment">Thanh toán</span><span data-tone="trip">Công tác</span><span data-tone="handover">Bàn giao</span></div><div id="monthCalendar"><div class="sk"></div></div></section>'}
function loadReferences(){Promise.all([MiniERP.api.call('auth.me',{}, {silent:true}),MiniERP.api.call('project.list',{}, {silent:true})]).then(function(r){auth=r[0].data||{};projects=r[1].data||[];fillProjects();var roles=[auth.role].concat(auth.extra_roles||[]),canWrite=roles.some(function(x){return['admin','manager','engineer','employee'].indexOf(x)>=0}),canList=roles.indexOf('admin')>=0||roles.indexOf('manager')>=0||roles.indexOf('director')>=0||roles.indexOf('hr')>=0||roles.indexOf('employee')>=0;document.getElementById('newTask').classList.toggle('hidden',!canWrite);if(!canList){employees=[{emp_id:auth.emp_id,full_name:auth.name}];return null}return MiniERP.api.call('employee.list',{}, {silent:true}).then(function(x){employees=x.data||[]})}).then(function(){loadTasks();loadCalendar()})}
function fillProjects(){['taskProjectFilter','calendarProject'].forEach(function(id){var select=document.getElementById(id);if(!select)return;var first=select.options[0].outerHTML;select.innerHTML=first+projects.map(function(x){return'<option value="'+MiniERP.ui.escape(x.project_id)+'">'+MiniERP.ui.escape(x.project_id+' · '+x.name)+'</option>'}).join('')})}
function bindKanban(){document.getElementById('taskProjectFilter').onchange=loadTasks;document.getElementById('taskBoard').onclick=function(e){var button=e.target.closest('[data-move]');if(button)requestMove(button.dataset.task,button.dataset.move)};document.getElementById('taskBoard').ondragstart=function(e){var card=e.target.closest('[data-task-card]');if(card)e.dataTransfer.setData('text/plain',card.dataset.taskCard)};document.getElementById('taskBoard').ondragover=function(e){if(e.target.closest('[data-drop-status]'))e.preventDefault()};document.getElementById('taskBoard').ondrop=function(e){var col=e.target.closest('[data-drop-status]');if(!col)return;e.preventDefault();requestMove(e.dataTransfer.getData('text/plain'),col.dataset.dropStatus)}}
function loadTasks(){MiniERP.api.call('task.list',{project_id:document.getElementById('taskProjectFilter').value},{silent:true}).then(function(r){tasks=r.data||[];renderBoard()})}
function renderBoard(){var labels={wait:'Chờ gia công',doing:'Đang làm',qc:'Chờ kiểm tra (QC)',done:'Hoàn thành'},order=['wait','doing','qc','done'];document.getElementById('taskBoard').innerHTML=order.map(function(status,index){var rows=tasks.filter(function(x){return x.status===status});return'<section class="kanban-column" data-drop-status="'+status+'"><header><b>'+labels[status]+'</b><span>'+rows.length+'</span></header><div class="kanban-cards">'+(rows.length?rows.map(function(x){return'<article class="task-card" draggable="true" data-task-card="'+MiniERP.ui.escape(x.task_id)+'"><div><span class="code">'+MiniERP.ui.escape(x.task_id)+'</span>'+MiniERP.ui.chip(x.priority||'normal',x.priority==='high'?'bad':'info')+'</div><h3>'+MiniERP.ui.escape(x.title)+'</h3><p>'+MiniERP.ui.escape(x.project_id+' · '+x.project_name)+'</p><small>'+MiniERP.ui.escape(x.assignee_name+' · hạn '+x.due_date)+'</small><footer>'+(index?'<button class="btn icon" data-task="'+MiniERP.ui.escape(x.task_id)+'" data-move="'+order[index-1]+'" aria-label="Chuyển lùi">‹</button>':'')+(index<order.length-1?'<button class="btn icon" data-task="'+MiniERP.ui.escape(x.task_id)+'" data-move="'+order[index+1]+'" aria-label="Chuyển tiếp">›</button>':'')+'</footer></article>'}).join(''):'<div class="kanban-empty">Chưa có công việc</div>')+'</div></section>'}).join('')}
function requestMove(id,status){var task=tasks.find(function(x){return x.task_id===id});if(!task)return;if(task.status==='qc'&&status==='doing'){MiniERP.ui.modal({title:'Trả công việc về Đang làm',body:'<div class="field"><label for="taskReturnReason">Lý do</label><textarea id="taskReturnReason" rows="3"></textarea><div id="taskReturnReason-error" class="field-error"></div></div>',confirmLabel:'Trả lại',onConfirm:function(){var reason=document.getElementById('taskReturnReason').value.trim();MiniERP.ui.setFieldError('taskReturnReason',reason?'':'Bắt buộc nhập lý do.');if(!reason)return false;moveTask(id,status,reason);return false}});return}moveTask(id,status,'')}
function moveTask(id,status,reason){MiniERP.api.call('task.move',{task_id:id,status:status,reason:reason}).then(function(r){MiniERP.ui.closeModal();MiniERP.ui.toast({title:'Đã cập nhật công việc',message:'Tiến độ dự án: '+r.data.project_progress_pct+'%'});loadTasks();loadCalendar()})}
function openTaskForm(){var assignees=employees.length?employees:[{emp_id:auth.emp_id,full_name:auth.name}],body='<form id="taskEditor"><div class="field"><label for="taskProject">Dự án</label><select id="taskProject"><option value="">Chọn dự án</option>'+projects.map(function(x){return'<option value="'+MiniERP.ui.escape(x.project_id)+'">'+MiniERP.ui.escape(x.project_id+' · '+x.name)+'</option>'}).join('')+'</select></div><div class="field"><label for="taskTitle">Tên công việc</label><input id="taskTitle"></div><div class="partner-form"><div class="field"><label for="taskAssignee">Người phụ trách</label><select id="taskAssignee">'+assignees.map(function(x){return'<option value="'+MiniERP.ui.escape(x.emp_id)+'">'+MiniERP.ui.escape(x.emp_id+' · '+x.full_name)+'</option>'}).join('')+'</select></div><div class="field"><label for="taskDue">Hạn hoàn thành</label><input id="taskDue" type="date"></div><div class="field"><label for="taskType">Loại</label><select id="taskType"><option value="machining">Gia công</option><option value="electrical_cabinet">Tủ điện</option><option value="plc">PLC</option><option value="assembly">Lắp ráp</option><option value="commissioning">Chạy thử</option><option value="design">Thiết kế</option><option value="other">Khác</option></select></div><div class="field"><label for="taskDependency">Phụ thuộc</label><select id="taskDependency"><option value="">Không có</option>'+tasks.map(function(x){return'<option value="'+MiniERP.ui.escape(x.task_id)+'">'+MiniERP.ui.escape(x.task_id+' · '+x.title)+'</option>'}).join('')+'</select></div></div><div id="taskFormError" class="field-error"></div></form>';MiniERP.ui.modal({title:'Giao công việc',body:body,confirmLabel:'Tạo công việc',onConfirm:function(){var payload={project_id:document.getElementById('taskProject').value,title:document.getElementById('taskTitle').value.trim(),assignee_emp_id:document.getElementById('taskAssignee').value,due_date:document.getElementById('taskDue').value,type:document.getElementById('taskType').value,depends_on:document.getElementById('taskDependency').value};if(!payload.project_id||!payload.title||!payload.assignee_emp_id||!payload.due_date){document.getElementById('taskFormError').textContent='Hãy nhập đủ dự án, tên, người phụ trách và hạn.';return false}MiniERP.api.call('task.create',payload).then(function(r){MiniERP.ui.closeModal();MiniERP.ui.toast({type:r.data.warning?'warning':'success',title:'Đã tạo công việc',message:r.data.warning||r.data.task.task_id});loadTasks();loadCalendar()});return false}})}
function bindCalendar(){document.getElementById('calendarMonth').onchange=function(){calendarMonth=this.value;loadCalendar()};document.getElementById('calendarProject').onchange=loadCalendar;document.getElementById('calendarPrev').onclick=function(){shiftMonth(-1)};document.getElementById('calendarNext').onclick=function(){shiftMonth(1)}}
function shiftMonth(delta){var parts=calendarMonth.split('-'),date=new Date(Number(parts[0]),Number(parts[1])-1+delta,1);calendarMonth=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');document.getElementById('calendarMonth').value=calendarMonth;loadCalendar()}
function loadCalendar(){MiniERP.api.call('calendar.list',{month:calendarMonth,project_id:document.getElementById('calendarProject').value},{silent:true}).then(function(r){calendarEvents=r.data||[];renderCalendar()})}
function renderCalendar(){var parts=calendarMonth.split('-'),year=Number(parts[0]),month=Number(parts[1])-1,days=new Date(year,month+1,0).getDate(),offset=(new Date(year,month,1).getDay()+6)%7,names=['T2','T3','T4','T5','T6','T7','CN'],html='<div class="calendar-grid">'+names.map(function(x){return'<b class="calendar-weekday">'+x+'</b>'}).join('');for(var blank=0;blank<offset;blank++)html+='<div class="calendar-day muted"></div>';for(var day=1;day<=days;day++){var date=calendarMonth+'-'+String(day).padStart(2,'0'),events=calendarEvents.filter(function(x){return x.date<=date&&(!x.end_date||x.end_date>=date)});html+='<div class="calendar-day"><strong>'+day+'</strong>'+events.map(function(x){return'<span class="calendar-event '+x.type+'" title="'+MiniERP.ui.escape(x.project_name)+'">'+MiniERP.ui.escape(x.title)+'</span>'}).join('')+'</div>'}html+='</div>';document.getElementById('monthCalendar').innerHTML=html}
})();
</script>
