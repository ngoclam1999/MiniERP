<script>
(function(){'use strict';var previous=route,prs=[],pos=[],etaRows=[],projects=[],items=[],suppliers=[];
route=function(){var p=(location.hash||'#dashboard').slice(1);if(p==='purchasing'){renderPurchasing();document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active',a.hash==='#purchasing')});viewName.textContent='Mua hàng'}else previous()};addEventListener('hashchange',function(){route()});
function renderPurchasing(){var v=document.querySelector('main.content');v.dataset.page='purchasing';v.innerHTML='<div class="head"><div><h1>Mua hàng</h1><p>Quản lý yêu cầu mua, đơn mua và tiến độ giao hàng.</p></div><button class="btn primary" id="newPr">Tạo PR thủ công</button></div><div id="purchaseTabs"></div>';MiniERP.ui.tabs(document.getElementById('purchaseTabs'),[{id:'pr',label:'Yêu cầu mua (PR)',content:prHtml()},{id:'po',label:'Đơn mua (PO)',content:poHtml()},{id:'eta',label:'Tiến độ ETA',content:etaHtml()}]);bind();loadReferences()}
function prHtml(){return '<section class="card component-block"><div class="catalog-toolbar"><div class="catalog-actions"><div class="field catalog-search"><label for="prSearch">Tìm PR</label><input id="prSearch" type="search" placeholder="Mã PR, dự án, SKU…"></div><div class="field"><label for="prStatus">Trạng thái</label><select id="prStatus"><option value="">Tất cả</option><option value="open">Đang mở</option><option value="po_created">Đã tạo PO</option><option value="cancelled">Đã huỷ</option></select></div></div><span id="prCount" class="label"></span></div><div id="prTable"><div class="sk"></div></div><div class="purchase-selection"><div class="field"><label for="prSupplier">Nhà cung cấp cho PR đã chọn</label><select id="prSupplier"><option value="">Chọn nhà cung cấp</option></select><div class="field-help">Không thấy nhà cung cấp? <a href="#suppliers" class="link">Tạo nhà cung cấp trước</a>.</div></div><button class="btn primary" id="prToPo" type="button">Tạo PO từ PR đã chọn</button></div></section>'}
function poHtml(){return '<section class="card component-block"><div class="catalog-toolbar"><div class="field catalog-search"><label for="poSearch">Tìm PO</label><input id="poSearch" type="search" placeholder="Mã PO hoặc nhà cung cấp…"></div><span id="poCount" class="label"></span></div><div id="poTable"><div class="sk"></div></div></section>'}
function etaHtml(){return '<section class="card component-block"><div class="catalog-toolbar"><div class="field catalog-search"><label for="etaSearch">Tìm ETA</label><input id="etaSearch" type="search" placeholder="PO, SKU, dự án…"></div><span class="label">Cam: hôm nay · nét đứt: ngày cần</span></div><div id="etaGantt"><div class="sk"></div></div></section>'}
function bind(){document.getElementById('newPr').onclick=openPrModal;document.getElementById('prSearch').oninput=loadPr;document.getElementById('prStatus').onchange=loadPr;document.getElementById('prToPo').onclick=createPoFromSelection;document.getElementById('prTable').onclick=handlePrAction;document.getElementById('poSearch').oninput=loadPo;document.getElementById('poTable').onclick=handlePoAction;document.getElementById('etaSearch').oninput=loadEta}
function loadReferences(){Promise.all([MiniERP.api.call('project.list',{}, {silent:true}),MiniERP.api.call('item.list',{search:''},{silent:true}),MiniERP.api.call('supplier.list',{search:''},{silent:true})]).then(function(r){projects=r[0].data||[];items=r[1].data||[];suppliers=r[2].data||[];fillSupplier();loadPr();loadPo();loadEta()})}
function fillSupplier(){var s=document.getElementById('prSupplier');s.innerHTML=s.options[0].outerHTML+suppliers.map(function(x){return'<option value="'+MiniERP.ui.escape(x.sup_id)+'">'+MiniERP.ui.escape(x.sup_id+' · '+x.name)+'</option>'}).join('')}
function loadPr(){MiniERP.api.call('pr.list',{search:document.getElementById('prSearch').value,status:document.getElementById('prStatus').value},{silent:true}).then(function(r){prs=r.data||[];renderPr()})}
function renderPr(){document.getElementById('prCount').textContent=prs.length+' PR';document.getElementById('prTable').innerHTML=MiniERP.ui.table({columns:[{key:'select',label:'Chọn',render:function(x){return x.status==='open'?'<input type="checkbox" data-pr="'+MiniERP.ui.escape(x.pr_id)+'" aria-label="Chọn '+MiniERP.ui.escape(x.pr_id)+'">':'—'}},{key:'pr_id',label:'Mã PR'},{key:'project_id',label:'Dự án',render:function(x){return'<span class="code">'+MiniERP.ui.escape(x.project_id)+'</span><br><span class="label">'+MiniERP.ui.escape(x.project_name)+'</span>'}},{key:'sku',label:'Vật tư',render:function(x){return'<span class="code">'+MiniERP.ui.escape(x.sku)+'</span><br><span class="label">'+MiniERP.ui.escape(x.item_name)+'</span>'}},{key:'qty',label:'Số lượng',numeric:true},{key:'need_date',label:'Ngày cần'},{key:'source',label:'Nguồn',render:function(x){return MiniERP.ui.chip(x.source==='manual'?'Thủ công':'BOM tự động','info')}},{key:'status',label:'Trạng thái',render:function(x){return MiniERP.ui.chip(x.status==='open'?'Đang mở':x.status==='po_created'?'Đã tạo PO':'Đã huỷ',x.status==='open'?'warn':x.status==='po_created'?'good':'bad')}},{key:'action',label:'',render:function(x){return x.status==='open'?'<button class="btn" data-cancel-pr="'+MiniERP.ui.escape(x.pr_id)+'">Huỷ</button>':'—'}}],rows:prs,emptyText:'Chưa có yêu cầu mua'})}
function openPrModal(){var body='<form id="manualPrForm"><div class="field"><label for="manualPrProject">Dự án</label><select id="manualPrProject"><option value="">Chọn dự án</option>'+projects.map(function(x){return'<option value="'+MiniERP.ui.escape(x.project_id)+'">'+MiniERP.ui.escape(x.project_id+' · '+x.name)+'</option>'}).join('')+'</select><div class="field-help">Không thấy dự án? <a href="#projects" class="link">Tạo dự án trước</a>.</div></div><div class="field"><label for="manualPrSku">Vật tư</label><select id="manualPrSku"><option value="">Chọn vật tư</option>'+items.map(function(x){return'<option value="'+MiniERP.ui.escape(x.sku)+'">'+MiniERP.ui.escape(x.sku+' · '+x.name)+'</option>'}).join('')+'</select><div class="field-help">Không thấy vật tư? <a href="#items" class="link">Tạo vật tư trước</a>.</div></div><div class="field"><label for="manualPrQty">Số lượng</label><input id="manualPrQty" type="number" min="0.0001" step="any"></div><div class="field"><label for="manualPrDate">Ngày cần</label><input id="manualPrDate" type="date"></div></form>';MiniERP.ui.modal({title:'Tạo yêu cầu mua thủ công',body:body,confirmLabel:'Tạo PR',onConfirm:function(){var p={project_id:manualPrProject.value,sku:manualPrSku.value,qty:manualPrQty.value,need_date:manualPrDate.value};if(!p.project_id||!p.sku||!(Number(p.qty)>0)||!p.need_date){MiniERP.ui.toast({type:'error',title:'Thiếu thông tin',message:'Hãy nhập đủ dự án, vật tư, số lượng và ngày cần.'});return false}MiniERP.api.call('pr.create_manual',p).then(function(){MiniERP.ui.closeModal();MiniERP.ui.toast({title:'Đã tạo PR',message:'Yêu cầu mua thủ công đã được ghi nhận.'});loadPr()});return false}})}
function handlePrAction(e){var b=e.target.closest('[data-cancel-pr]');if(!b)return;MiniERP.ui.modal({title:'Huỷ yêu cầu mua',body:'<p>PR '+MiniERP.ui.escape(b.dataset.cancelPr)+' sẽ chuyển sang trạng thái đã huỷ.</p>',confirmLabel:'Huỷ PR',danger:true,onConfirm:function(){MiniERP.api.call('pr.cancel',{pr_id:b.dataset.cancelPr}).then(loadPr);return true}})}
function createPoFromSelection(){var ids=Array.from(document.querySelectorAll('[data-pr]:checked')).map(function(x){return x.dataset.pr}),sup=document.getElementById('prSupplier').value;if(!ids.length||!sup){MiniERP.ui.toast({type:'warning',title:'Chưa đủ lựa chọn',message:'Hãy chọn ít nhất một PR và một nhà cung cấp.'});return}MiniERP.api.call('pr.to_po',{pr_ids:ids,sup_id:sup}).then(function(r){MiniERP.ui.toast({title:'Đã tạo PO',message:r.data.po_id+' đang ở trạng thái nháp.'});loadPr();loadPo()})}
function loadPo(){MiniERP.api.call('po.list',{search:document.getElementById('poSearch').value},{silent:true}).then(function(r){pos=r.data||[];renderPo()})}
function loadEta(){MiniERP.api.call('eta.list',{search:document.getElementById('etaSearch').value},{silent:true}).then(function(r){etaRows=r.data||[];renderEta()})}
function renderEta(){var el=document.getElementById('etaGantt');if(!etaRows.length){el.innerHTML='<div class="empty-view">Chưa có dòng ETA đang theo dõi.</div>';return}var dates=[];etaRows.forEach(function(x){dates.push(Date.parse(x.order_date+'T00:00:00Z'),Date.parse(x.eta_date+'T00:00:00Z'),Date.parse(x.need_date+'T00:00:00Z'))});dates.push(Date.now());var min=Math.min.apply(Math,dates),max=Math.max.apply(Math,dates),span=Math.max(86400000,max-min);el.innerHTML='<div class="eta-list">'+etaRows.map(function(x){var start=(Date.parse(x.order_date+'T00:00:00Z')-min)/span*100,end=(Date.parse(x.eta_date+'T00:00:00Z')-min)/span*100,need=(Date.parse(x.need_date+'T00:00:00Z')-min)/span*100,today=(Date.now()-min)/span*100,tone=x.eta_state==='late'?'bad':x.eta_state==='soon'?'warn':x.eta_state==='received'?'good':'info';return'<div class="eta-row"><div><b>'+MiniERP.ui.escape(x.sku)+'</b><span>'+MiniERP.ui.escape(x.po_id+' · '+x.project_name)+'</span></div><div class="eta-track"><i class="eta-today" style="left:'+today+'%"></i><i class="eta-need" style="left:'+need+'%"></i><span class="eta-bar '+tone+'" style="left:'+start+'%;width:'+Math.max(2,end-start)+'%"></span></div><small>'+MiniERP.ui.escape(x.order_date+' → '+x.eta_date+' · cần '+x.need_date)+'</small></div>'}).join('')+'</div>'}
function money(x){return Number(x||0).toLocaleString('vi-VN')+' ₫'}
function renderPo(){document.getElementById('poCount').textContent=pos.length+' PO';document.getElementById('poTable').innerHTML=MiniERP.ui.table({columns:[{key:'po_id',label:'Mã PO'},{key:'supplier_name',label:'Nhà cung cấp'},{key:'order_date',label:'Ngày đặt'},{key:'lines',label:'Số dòng',numeric:true,render:function(x){return String((x.lines||[]).length)}},{key:'total_vnd',label:'Tổng tiền',numeric:true,render:function(x){return money(x.total_vnd)}},{key:'status',label:'Trạng thái',render:function(x){return MiniERP.ui.chip(poStatus(x.status),x.status==='confirmed'?'good':x.status==='cancelled'?'bad':'info')}},{key:'actions',label:'Thao tác',render:poActions}],rows:pos,emptyText:'Chưa có đơn mua'})}
function poStatus(s){return{draft:'Nháp',sent:'Đã gửi',confirmed:'Đã xác nhận',in_transit:'Đang vận chuyển',partial:'Nhận một phần',received:'Đã nhận',cancelled:'Đã huỷ'}[s]||s}
function poActions(x){var a=['<button class="btn" data-view-po="'+MiniERP.ui.escape(x.po_id)+'">Chi tiết</button>'];if(x.status!=='cancelled')a.push('<button class="btn" data-pdf-po="'+MiniERP.ui.escape(x.po_id)+'">Xuất PDF</button>');if(x.status==='draft')a.push('<button class="btn" data-edit-po="'+MiniERP.ui.escape(x.po_id)+'">Sửa</button><button class="btn primary" data-send-po="'+MiniERP.ui.escape(x.po_id)+'">Gửi</button>');if(x.status==='sent')a.push('<button class="btn primary" data-confirm-po="'+MiniERP.ui.escape(x.po_id)+'">Xác nhận</button>');if(['draft','sent','confirmed'].indexOf(x.status)>=0)a.push('<button class="btn" data-cancel-po="'+MiniERP.ui.escape(x.po_id)+'">Huỷ</button>');return'<div class="row-actions">'+a.join('')+'</div>'}
function handlePoAction(e){var view=e.target.closest('[data-view-po]'),pdf=e.target.closest('[data-pdf-po]'),edit=e.target.closest('[data-edit-po]'),send=e.target.closest('[data-send-po]'),confirm=e.target.closest('[data-confirm-po]'),cancel=e.target.closest('[data-cancel-po]');if(view)openPoDetail(view.dataset.viewPo);if(pdf)exportPoPdf(pdf.dataset.pdfPo,pdf);if(edit)openPoEdit(edit.dataset.editPo);if(send)runPoAction('po.send',send.dataset.sendPo);if(confirm)runPoAction('po.confirm',confirm.dataset.confirmPo);if(cancel)runPoAction('po.cancel',cancel.dataset.cancelPo)}
function exportPoPdf(id,button){button.disabled=true;MiniERP.api.call('po.export_pdf',{po_id:id},{silent:true}).then(function(r){MiniERP.ui.toast({title:'Đã tạo PDF',message:r.data.name,action:{label:'Mở tệp',onClick:function(){window.open(r.data.url,'_blank')}}})}).finally(function(){button.disabled=false})}
function runPoAction(action,id){MiniERP.api.call(action,{po_id:id}).then(function(){MiniERP.ui.toast({title:'Đã cập nhật PO',message:id+' đã chuyển trạng thái.'});loadPo();loadPr()})}
function openPoDetail(id){var po=pos.find(function(x){return x.po_id===id});if(!po)return;var body='<div class="detail-grid"><div class="detail-item"><span>Nhà cung cấp</span><b>'+MiniERP.ui.escape(po.supplier_name)+'</b></div><div class="detail-item"><span>Trạng thái</span><b>'+MiniERP.ui.escape(poStatus(po.status))+'</b></div><div class="detail-item"><span>Điều khoản</span><b>'+MiniERP.ui.escape(po.payment_terms||'—')+'</b></div><div class="detail-item"><span>Tổng tiền</span><b>'+money(po.total_vnd)+'</b></div></div>'+MiniERP.ui.table({columns:[{key:'sku',label:'SKU'},{key:'project_id',label:'Dự án'},{key:'qty',label:'SL',numeric:true},{key:'unit_price_vnd',label:'Đơn giá',numeric:true,render:function(x){return money(x.unit_price_vnd)}},{key:'lead_time_days',label:'Lead-time',numeric:true},{key:'eta_date',label:'ETA',render:function(x){return MiniERP.ui.escape(x.eta_date||'—')+'<br><span class="label">'+(x.eta_source==='manual'?'Sửa tay':'Tự tính')+'</span>'}},{key:'eta_action',label:'',render:function(x){return po.status==='cancelled'||po.status==='received'?'—':'<button class="btn" data-edit-eta="'+MiniERP.ui.escape(x.line_id)+'">Sửa ETA</button>'}}],rows:po.lines||[]});MiniERP.ui.modal({title:'Chi tiết '+id,body:body,confirmLabel:'Đóng'});document.querySelectorAll('[data-edit-eta]').forEach(function(button){button.onclick=function(){var line=po.lines.find(function(x){return x.line_id===button.dataset.editEta});openEtaEdit(line,id)}})}
function openEtaEdit(line,poId){MiniERP.ui.closeModal();MiniERP.ui.modal({title:'Sửa ETA · '+line.line_id,body:'<form id="etaEditForm"><div class="field"><label for="etaEditDate">Ngày dự kiến hàng về</label><input id="etaEditDate" type="date" value="'+MiniERP.ui.escape(line.eta_date||'')+'"></div><div class="field"><label for="etaEditNote">Lý do điều chỉnh</label><textarea id="etaEditNote" rows="3">'+MiniERP.ui.escape(line.eta_note||'')+'</textarea><div class="field-help">Lần sửa được ghi vào AuditLog với giá trị trước và sau.</div></div></form>',confirmLabel:'Lưu ETA',onConfirm:function(){var date=document.getElementById('etaEditDate').value,note=document.getElementById('etaEditNote').value.trim();if(!date||!note){MiniERP.ui.toast({type:'warning',title:'Thiếu thông tin',message:'Hãy nhập ngày ETA và lý do điều chỉnh.'});return false}MiniERP.api.call('eta.update',{line_id:line.line_id,eta_date:date,note:note}).then(function(){MiniERP.ui.closeModal();MiniERP.ui.toast({title:'Đã cập nhật ETA',message:line.line_id+' đã lưu ngày giao mới.'});loadPo()});return false}})}
function openPoEdit(id){var po=pos.find(function(x){return x.po_id===id});if(!po)return;var body='<form id="poEditForm"><div class="field"><label for="poEditSupplier">Nhà cung cấp</label><select id="poEditSupplier">'+suppliers.map(function(x){return'<option value="'+MiniERP.ui.escape(x.sup_id)+'" '+(x.sup_id===po.sup_id?'selected':'')+'>'+MiniERP.ui.escape(x.sup_id+' · '+x.name)+'</option>'}).join('')+'</select></div><div class="field"><label for="poEditTerms">Điều khoản thanh toán</label><input id="poEditTerms" value="'+MiniERP.ui.escape(po.payment_terms)+'"></div><div class="table"><table><thead><tr><th>SKU</th><th>Số lượng</th><th>Đơn giá</th><th>Lead-time</th></tr></thead><tbody>'+po.lines.map(function(x){return'<tr data-po-line="'+MiniERP.ui.escape(x.line_id)+'" data-sku="'+MiniERP.ui.escape(x.sku)+'" data-project="'+MiniERP.ui.escape(x.project_id)+'" data-pr="'+MiniERP.ui.escape(x.pr_id)+'" data-need="'+MiniERP.ui.escape(x.need_date)+'"><td>'+MiniERP.ui.escape(x.sku)+'</td><td><input class="table-input" data-qty type="number" min="0.0001" step="any" value="'+MiniERP.ui.escape(x.qty)+'"></td><td><input class="table-input" data-price type="number" min="0" step="any" value="'+MiniERP.ui.escape(x.unit_price_vnd)+'"></td><td><input class="table-input" data-lead type="number" min="0" step="1" value="'+MiniERP.ui.escape(x.lead_time_days)+'"></td></tr>'}).join('')+'</tbody></table></div></form>';MiniERP.ui.modal({title:'Sửa '+id,body:body,confirmLabel:'Lưu thay đổi',onConfirm:function(){var lines=Array.from(document.querySelectorAll('[data-po-line]')).map(function(row){return{line_id:row.dataset.poLine,sku:row.dataset.sku,project_id:row.dataset.project,pr_id:row.dataset.pr,need_date:row.dataset.need,qty:row.querySelector('[data-qty]').value,unit_price_vnd:row.querySelector('[data-price]').value,lead_time_days:row.querySelector('[data-lead]').value}});MiniERP.api.call('po.update',{po_id:id,patch:{sup_id:poEditSupplier.value,payment_terms:poEditTerms.value,lines:lines}}).then(function(){MiniERP.ui.closeModal();MiniERP.ui.toast({title:'Đã lưu PO',message:id+' đã được cập nhật.'});loadPo()});return false}})}
})();
</script>
