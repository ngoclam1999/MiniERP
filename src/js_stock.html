<script>
(function(){'use strict';var previous=route,warehouses=[],projects=[],items=[],stockRows=[],activeStocktake=null,receiptScan=null;
route=function(){var p=(location.hash||'#dashboard').slice(1);if(p==='stock'){renderStock();document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active',a.hash==='#stock')});viewName.textContent='Kho'}else previous()};addEventListener('hashchange',function(){route()});
function renderStock(){var v=document.querySelector('main.content');v.dataset.page='stock';v.innerHTML='<div class="head"><div><h1>Kho</h1><p>Tồn kho, nhập/xuất vật tư theo dự án và kiểm kê.</p></div></div><div id="stockTabs"></div>';MiniERP.ui.tabs(document.getElementById('stockTabs'),[{id:'inventory',label:'Tồn kho',content:inventoryHtml()},{id:'receipt',label:'Nhập kho',content:receiptHtml()},{id:'issue',label:'Phiếu xuất',content:issueHtml()},{id:'stocktake',label:'Kiểm kê',content:stocktakeHtml()}]);bindInventory();bindReceipt();bindIssue();bindStocktake();loadReferences()}
function inventoryHtml(){return '<section class="card component-block"><div class="catalog-toolbar"><div class="catalog-actions"><div class="field"><label for="stockWh">Kho</label><select id="stockWh"><option value="">Tất cả kho</option></select></div><div class="field catalog-search"><label for="stockQ">Tìm kiếm</label><input id="stockQ" type="search" placeholder="SKU, tên hoặc mã vạch…"></div></div><span id="stockCount" class="label"></span></div><div id="stockTable"><div class="sk"></div></div></section><section class="card component-block" id="stockCard" style="margin-top:16px"><div class="empty-view">Chọn một SKU để xem thẻ kho.</div></section>'}
function issueHtml(){return '<section class="card component-block"><div class="title"><div><h2>Phiếu xuất kho cho dự án</h2><p class="label">Chỉ xuất vật tư đã được giữ chỗ đúng dự án.</p></div></div><form id="issueForm" novalidate><div class="stock-form-grid"><div class="field"><label for="issueProject">Dự án</label><select id="issueProject" required><option value="">Chọn dự án</option></select><div class="field-help">Không thấy dự án? <a class="link" href="#projects">Tạo hoặc kiểm tra dự án</a>.</div></div><div class="field"><label for="issueSku">Vật tư đã giữ chỗ</label><select id="issueSku" required><option value="">Chọn dự án trước</option></select><div id="issueReserveHelp" class="field-help">Danh sách chỉ hiển thị vật tư đang giữ cho dự án.</div></div><div class="field"><label for="issueQty">Số lượng xuất</label><input id="issueQty" type="number" min="0.0001" step="any" required><div id="issueQty-error" class="field-error" aria-live="polite"></div></div></div><div class="settings-actions"><button class="btn primary" id="issueSubmit" type="submit">Tạo và xuất phiếu</button></div></form><div id="issueResult" class="operation-result" aria-live="polite"></div></section>'}
function receiptHtml(){return '<section class="card component-block"><div class="title"><div><h2>Nhập kho bằng mã vạch / SKU</h2><p class="label">Máy quét kiểu bàn phím có thể nhập trực tiếp rồi nhấn Enter.</p></div></div><form id="receiptScanForm"><div class="stock-form-grid"><div class="field"><label for="receiptCode">Mã vạch hoặc SKU</label><input id="receiptCode" autocomplete="off" inputmode="text"></div><div class="field"><label for="receiptPoLine">Dòng PO gợi ý</label><select id="receiptPoLine"><option value="">Quét mã trước</option></select></div><div class="field"><label for="receiptQty">Số lượng nhận</label><input id="receiptQty" type="number" min="0.0001" step="any"></div></div><div id="receiptHelp" class="field-help"></div><div class="settings-actions"><button class="btn primary" type="submit">Quét / tìm</button><button class="btn primary" id="receiptPost" type="button" disabled>Nhập kho</button></div></form><div id="receiptResult" class="operation-result"></div></section>'}
function stocktakeHtml(){return '<section class="card component-block"><div class="title"><div><h2>Kiểm kê kho</h2><p class="label">Sổ vẫn hoạt động trong lúc đếm; khi duyệt, hệ thống áp dụng chênh lệch từ ảnh chụp ban đầu.</p></div></div><div class="catalog-toolbar"><div class="field"><label for="stocktakeWh">Kho</label><select id="stocktakeWh"><option value="">Chọn kho</option></select></div><button class="btn primary" id="stocktakeCreate" type="button">Tạo phiếu kiểm kê</button></div><div id="stocktakeEditor"><div class="empty-view">Chọn kho và tạo phiếu để bắt đầu nhập số đếm.</div></div></section>'}
function loadReferences(){Promise.all([MiniERP.api.call('warehouse.list',{}, {silent:true}),MiniERP.api.call('project.list',{}, {silent:true}),MiniERP.api.call('item.list',{search:''},{silent:true}),MiniERP.api.call('stock.list',{}, {silent:true})]).then(function(r){warehouses=r[0].data||[];projects=r[1].data||[];items=r[2].data||[];stockRows=r[3].data||[];fillSelect('stockWh',warehouses,'wh_id','name');fillSelect('stocktakeWh',warehouses,'wh_id','name');fillSelect('issueProject',projects,'project_id','name');renderRows(stockRows)})}
function fillSelect(id,rows,key,label){var s=document.getElementById(id);if(!s)return;var first=s.options[0].outerHTML;s.innerHTML=first+rows.map(function(x){return'<option value="'+MiniERP.ui.escape(x[key])+'">'+MiniERP.ui.escape(x[key]+' · '+x[label])+'</option>'}).join('')}
function bindReceipt(){document.getElementById('receiptScanForm').onsubmit=function(e){e.preventDefault();scanReceipt()};document.getElementById('receiptPost').onclick=postReceipt;document.getElementById('receiptPoLine').onchange=function(){var line=(receiptScan&&receiptScan.po_lines||[]).find(function(x){return x.line_id===receiptPoLine.value});if(line){receiptQty.max=line.remaining_qty;receiptQty.value=line.remaining_qty;receiptHelp.textContent='Còn nhận '+line.remaining_qty+' · dự án '+line.project_id}}}
function scanReceipt(){var code=document.getElementById('receiptCode').value.trim();if(!code)return;MiniERP.api.call('gr.scan',{code:code}).then(function(r){receiptScan=r.data;var lines=receiptScan.po_lines||[],s=document.getElementById('receiptPoLine');s.innerHTML='<option value="">'+(lines.length?'Chọn dòng PO':'Không có PO — nhập kho chung')+'</option>'+lines.map(function(x){return'<option value="'+MiniERP.ui.escape(x.line_id)+'">'+MiniERP.ui.escape(x.po_id+' · còn '+x.remaining_qty+' · '+x.project_id)+'</option>'}).join('');document.getElementById('receiptHelp').textContent=receiptScan.warning||receiptScan.item.sku+' · '+receiptScan.item.name;document.getElementById('receiptPost').disabled=false;if(lines.length){s.value=lines[0].line_id;s.onchange()}})}
function postReceipt(){if(!receiptScan)return;var qty=Number(document.getElementById('receiptQty').value),lineId=document.getElementById('receiptPoLine').value;if(!(qty>0)){MiniERP.ui.toast({type:'warning',title:'Số lượng chưa hợp lệ',message:'Số lượng nhập phải lớn hơn 0.'});return}MiniERP.api.call('gr.post',{lines:[{po_line_id:lineId,sku:receiptScan.item.sku,qty:qty}]},{silent:true}).then(function(r){document.getElementById('receiptResult').innerHTML='<div class="result-banner good"><strong>Đã nhập kho</strong><span>'+MiniERP.ui.escape(r.data.receipt.gr_id+' · '+receiptScan.item.sku+' · '+qty)+'</span></div>';MiniERP.ui.toast({title:'Nhập kho thành công',message:r.data.warning||r.data.receipt.gr_id});receiptScan=null;receiptCode.value='';receiptPoLine.innerHTML='<option value="">Quét mã trước</option>';receiptQty.value='';receiptPost.disabled=true;loadStock()})}
function bindInventory(){document.getElementById('stockWh').onchange=loadStock;document.getElementById('stockQ').oninput=loadStock;document.getElementById('stockTable').onclick=function(e){var x=e.target.closest('[data-card]');if(x)loadCard(x.dataset.card)}}
function loadStock(){MiniERP.api.call('stock.list',{wh_id:document.getElementById('stockWh').value,search:document.getElementById('stockQ').value},{silent:true}).then(function(r){stockRows=r.data||[];renderRows(stockRows)})}
function renderRows(rows){var count=document.getElementById('stockCount');if(!count)return;count.textContent=rows.length+' dòng tồn';document.getElementById('stockTable').innerHTML=MiniERP.ui.table({columns:[{key:'sku',label:'SKU'},{key:'name',label:'Tên vật tư'},{key:'warehouse_name',label:'Kho'},{key:'qty_on_hand',label:'Tồn thực tế',numeric:true},{key:'qty_reserved',label:'Đã gán dự án',numeric:true},{key:'available',label:'Khả dụng',numeric:true},{key:'alert',label:'Cảnh báo',render:function(x){return x.alert?MiniERP.ui.chip(x.alert==='out'?'Hết':'Dưới mức',x.alert==='out'?'bad':'warn'):'—'}},{key:'x',label:'',render:function(x){return'<button class="btn" data-card="'+MiniERP.ui.escape(x.sku)+'">Thẻ kho</button>'}}],rows:rows,emptyText:'Chưa có tồn kho'})}
function loadCard(sku){MiniERP.api.call('stock.card',{sku:sku}).then(function(r){var moves=(r.data&&r.data.movements)||[];document.getElementById('stockCard').innerHTML='<div class="title"><h2>Thẻ kho · '+MiniERP.ui.escape(sku)+'</h2></div>'+MiniERP.ui.table({columns:[{key:'ts',label:'Thời gian'},{key:'type',label:'Loại'},{key:'wh_id',label:'Kho'},{key:'qty',label:'Số lượng',numeric:true},{key:'project_id',label:'Dự án'},{key:'ref_doc',label:'Chứng từ'}],rows:moves,emptyText:'Chưa có giao dịch'})})}
function bindIssue(){document.getElementById('issueProject').onchange=refreshIssueSkus;document.getElementById('issueSku').onchange=refreshIssueHelp;document.getElementById('issueForm').onsubmit=function(e){e.preventDefault();submitIssue()}}
function reservedForProject(projectId){var totals={};stockRows.forEach(function(row){(row.reservations||[]).forEach(function(r){if(String(r.project_id)===String(projectId))totals[r.sku]=(totals[r.sku]||0)+Number(r.qty||0)})});return totals}
function refreshIssueSkus(){var totals=reservedForProject(document.getElementById('issueProject').value),s=document.getElementById('issueSku'),keys=Object.keys(totals);s.innerHTML='<option value="">'+(keys.length?'Chọn vật tư':'Chưa có vật tư giữ chỗ')+'</option>'+keys.map(function(sku){var item=items.find(function(x){return String(x.sku)===String(sku)})||{};return'<option value="'+MiniERP.ui.escape(sku)+'" data-max="'+totals[sku]+'">'+MiniERP.ui.escape(sku+' · '+(item.name||'')+' · đang giữ '+totals[sku])+'</option>'}).join('');refreshIssueHelp()}
function refreshIssueHelp(){var s=document.getElementById('issueSku'),o=s.options[s.selectedIndex],max=o&&o.dataset.max||'';document.getElementById('issueReserveHelp').textContent=max?'Dự án đang giữ '+max+' đơn vị.':'Danh sách chỉ hiển thị vật tư đang giữ cho dự án.';if(max)document.getElementById('issueQty').max=max}
function submitIssue(){var projectId=document.getElementById('issueProject').value,sku=document.getElementById('issueSku').value,qty=Number(document.getElementById('issueQty').value),button=document.getElementById('issueSubmit'),result=document.getElementById('issueResult');MiniERP.ui.setFieldError('issueQty',qty>0?'':'Số lượng phải lớn hơn 0.');if(!projectId||!sku||!(qty>0))return;button.disabled=true;result.innerHTML='<div class="sk"></div>';MiniERP.api.call('issue.create',{project_id:projectId,lines:[{sku:sku,qty:qty}]},{silent:true}).then(function(r){return MiniERP.api.call('issue.post',{px_id:r.data.px_id},{silent:true})}).then(function(r){result.innerHTML='<div class="result-banner good"><strong>Xuất kho thành công</strong><span>Phiếu '+MiniERP.ui.escape(r.data.px_id)+' · dự án '+MiniERP.ui.escape(projectId)+' · '+qty+' '+MiniERP.ui.escape(sku)+'</span></div>';MiniERP.ui.toast({title:'Đã xuất kho',message:'Phiếu '+r.data.px_id+' đã được ghi nhận.'});return MiniERP.api.call('stock.list',{}, {silent:true})}).then(function(r){stockRows=r.data||[];renderRows(stockRows);refreshIssueSkus()}).catch(function(error){result.innerHTML='<div class="result-banner bad"><strong>Không thể xuất kho</strong><span>'+MiniERP.ui.escape(error.message||'Đã xảy ra lỗi.')+'</span></div>'}).finally(function(){button.disabled=false})}
function bindStocktake(){document.getElementById('stocktakeCreate').onclick=createStocktake}
function createStocktake(){var wh=document.getElementById('stocktakeWh').value;if(!wh){MiniERP.ui.toast({type:'warning',title:'Chưa chọn kho',message:'Hãy chọn kho cần kiểm kê.'});return}MiniERP.api.call('stocktake.create',{wh_id:wh}).then(function(r){activeStocktake=r.data;renderStocktakeEditor()})}
function renderStocktakeEditor(){var lines=activeStocktake.lines||[];document.getElementById('stocktakeEditor').innerHTML='<div class="stocktake-meta"><b>'+MiniERP.ui.escape(activeStocktake.kk_id)+'</b><span>'+MiniERP.ui.chip('Đang kiểm','warn')+'</span></div><form id="stocktakeForm"><div class="table"><table><thead><tr><th>SKU</th><th style="text-align:right">Tồn sổ lúc tạo</th><th>Thực đếm</th><th>Lý do chênh lệch âm</th><th>Dự án chịu phí</th></tr></thead><tbody>'+lines.map(function(x){return'<tr data-line="'+MiniERP.ui.escape(x.line_id)+'"><td class="code">'+MiniERP.ui.escape(x.sku)+'</td><td style="text-align:right">'+MiniERP.ui.escape(x.qty_book)+'</td><td><input class="table-input" data-count type="number" min="0" step="any" value="'+MiniERP.ui.escape(x.qty_counted)+'" aria-label="Thực đếm '+MiniERP.ui.escape(x.sku)+'"></td><td><input class="table-input" data-reason value="'+MiniERP.ui.escape(x.reason)+'" aria-label="Lý do '+MiniERP.ui.escape(x.sku)+'"></td><td><select class="table-input" data-project aria-label="Dự án '+MiniERP.ui.escape(x.sku)+'"><option value="">Không gắn dự án</option>'+projects.map(function(p){return'<option value="'+MiniERP.ui.escape(p.project_id)+'">'+MiniERP.ui.escape(p.project_id+' · '+p.name)+'</option>'}).join('')+'</select></td></tr>'}).join('')+'</tbody></table></div><div class="settings-actions stocktake-actions"><button class="btn" type="submit">Lưu số đếm</button><button class="btn primary" id="stocktakeApprove" type="button">Lưu và duyệt</button></div></form>';document.getElementById('stocktakeForm').onsubmit=function(e){e.preventDefault();saveCounts(false)};document.getElementById('stocktakeApprove').onclick=function(){saveCounts(true)}}
function collectCounts(){return Array.from(document.querySelectorAll('#stocktakeForm tbody tr')).map(function(row){return{line_id:row.dataset.line,qty_counted:row.querySelector('[data-count]').value,reason:row.querySelector('[data-reason]').value,project_id:row.querySelector('[data-project]').value}})}
function saveCounts(approve){MiniERP.api.call('stocktake.save_counts',{kk_id:activeStocktake.kk_id,lines:collectCounts()},{silent:true}).then(function(r){activeStocktake=r.data;if(!approve){MiniERP.ui.toast({title:'Đã lưu',message:'Số đếm kiểm kê đã được lưu.'});renderStocktakeEditor();return null}return MiniERP.api.call('stocktake.approve',{kk_id:activeStocktake.kk_id},{silent:true})}).then(function(r){if(!r)return;activeStocktake=r.data;document.getElementById('stocktakeEditor').innerHTML='<div class="result-banner good"><strong>Đã duyệt kiểm kê '+MiniERP.ui.escape(activeStocktake.kk_id)+'</strong><span>Các chênh lệch hợp lệ đã được ghi vào thẻ kho.</span></div>';MiniERP.ui.toast({title:'Đã duyệt kiểm kê',message:activeStocktake.kk_id});return MiniERP.api.call('stock.list',{}, {silent:true})}).then(function(r){if(r){stockRows=r.data||[];renderRows(stockRows)}}).catch(function(error){MiniERP.ui.toast({type:'error',title:'Không thể hoàn tất kiểm kê',message:error.message||'Đã xảy ra lỗi.',duration:0})})}
})();
</script>
