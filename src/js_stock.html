<script>
(function(){'use strict';var previous=route,warehouses=[];
route=function(){var p=(location.hash||'#dashboard').slice(1);if(p==='stock'){renderStock();document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active',a.hash==='#stock')});viewName.textContent='Kho'}else previous()};addEventListener('hashchange',function(){route()});
function renderStock(){var v=document.querySelector('main.content');v.dataset.page='stock';v.innerHTML='<div class="head"><div><h1>Tồn kho</h1><p>Tách bạch tồn thực tế, đã gán dự án và khả dụng.</p></div></div><section class="card component-block"><div class="catalog-toolbar"><div class="catalog-actions"><div class="field"><label for="stockWh">Kho</label><select id="stockWh"><option value="">Tất cả kho</option></select></div><div class="field catalog-search"><label for="stockQ">Tìm kiếm</label><input id="stockQ" type="search" placeholder="SKU, tên hoặc mã vạch…"></div></div><span id="stockCount" class="label"></span></div><div id="stockTable"><div class="sk"></div></div></section><section class="card component-block" id="stockCard" style="margin-top:16px"><div class="empty-view">Chọn một SKU để xem thẻ kho.</div></section>';Promise.all([MiniERP.api.call('warehouse.list',{}, {silent:true}),MiniERP.api.call('stock.list',{}, {silent:true})]).then(function(r){warehouses=r[0].data||[];var sel=document.getElementById('stockWh');warehouses.forEach(function(w){var o=document.createElement('option');o.value=w.wh_id;o.textContent=w.name;sel.appendChild(o)});renderRows(r[1].data||[])});document.getElementById('stockWh').onchange=load;document.getElementById('stockQ').oninput=load;document.getElementById('stockTable').onclick=function(e){var x=e.target.closest('[data-card]');if(x)loadCard(x.dataset.card)}}
function load(){MiniERP.api.call('stock.list',{wh_id:document.getElementById('stockWh').value,search:document.getElementById('stockQ').value},{silent:true}).then(function(r){renderRows(r.data||[])})}
function renderRows(rows){document.getElementById('stockCount').textContent=rows.length+' dòng tồn';document.getElementById('stockTable').innerHTML=MiniERP.ui.table({columns:[{key:'sku',label:'SKU'},{key:'name',label:'Tên vật tư'},{key:'warehouse_name',label:'Kho'},{key:'qty_on_hand',label:'Tồn thực tế',numeric:true},{key:'qty_reserved',label:'Đã gán dự án',numeric:true},{key:'available',label:'Khả dụng',numeric:true},{key:'alert',label:'Cảnh báo',render:function(x){return x.alert?MiniERP.ui.chip(x.alert==='out'?'Hết':'Dưới mức',x.alert==='out'?'bad':'warn'):'—'}},{key:'x',label:'',render:function(x){return'<button class="btn" data-card="'+MiniERP.ui.escape(x.sku)+'">Thẻ kho</button>'}}],rows:rows,emptyText:'Chưa có tồn kho'})}
function loadCard(sku){MiniERP.api.call('stock.card',{sku:sku}).then(function(r){var x=r.data,moves=x.movements||[];document.getElementById('stockCard').innerHTML='<div class="title"><h2>Thẻ kho · '+MiniERP.ui.escape(sku)+'</h2></div>'+MiniERP.ui.table({columns:[{key:'ts',label:'Thời gian'},{key:'type',label:'Loại'},{key:'wh_id',label:'Kho'},{key:'qty',label:'Số lượng',numeric:true},{key:'project_id',label:'Dự án'},{key:'ref_doc',label:'Chứng từ'}],rows:moves,emptyText:'Chưa có giao dịch'})})}
})();
</script>
