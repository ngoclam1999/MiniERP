<script>
(function(root){
  'use strict';
  var lastFocus=null;
  function esc(value){return String(value==null?'':value).replace(/[&<>'"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]})}
  function chip(label,type){return '<span class="chip '+esc(type||'info')+'">'+esc(label)+'</span>'}
  function table(options){
    var cols=options.columns||[],rows=options.rows||[];
    var head=cols.map(function(c){return '<th scope="col"'+(c.numeric?' style="text-align:right"':'')+'>'+esc(c.label)+'</th>'}).join('');
    var body=rows.length?rows.map(function(row){return '<tr>'+cols.map(function(c){var value=c.render?c.render(row):esc(row[c.key]);return '<td'+(c.numeric?' style="text-align:right;font-variant-numeric:tabular-nums"':'')+'>'+value+'</td>'}).join('')+'</tr>'}).join(''):'<tr><td colspan="'+cols.length+'" class="empty-view">'+esc(options.emptyText||'Chưa có dữ liệu')+'</td></tr>';
    return '<div class="table"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
  }
  function allocation(values,label){
    values=values||{};var parts=[['required','Yêu cầu'],['reserved','Giữ chỗ'],['ordered','Đã đặt'],['issued','Đã xuất']],total=parts.reduce(function(s,p){return s+Math.max(0,Number(values[p[0]])||0)},0)||1;
    return '<div class="allocation" role="img" aria-label="'+esc(label||'Phân bổ vật tư')+'">'+parts.map(function(p){var v=Math.max(0,Number(values[p[0]])||0);return '<span class="allocation-'+p[0]+'" style="width:'+(v/total*100)+'%" title="'+esc(p[1]+': '+v)+'"></span>'}).join('')+'</div><div class="allocation-legend">'+parts.map(function(p){return '<span><i class="allocation-'+p[0]+'"></i>'+esc(p[1])+': '+esc(values[p[0]]||0)+'</span>'}).join('')+'</div>';
  }
  function formField(options){var id=esc(options.id),errorId=id+'-error';return '<div class="field"><label for="'+id+'">'+esc(options.label)+'</label><input id="'+id+'" name="'+id+'" type="'+esc(options.type||'text')+'" aria-describedby="'+errorId+'" '+(options.required?'required':'')+'><div id="'+errorId+'" class="field-error" aria-live="polite"></div></div>'}
  function setFieldError(id,message){var input=document.getElementById(id),error=document.getElementById(id+'-error');if(input)input.setAttribute('aria-invalid',message?'true':'false');if(error)error.textContent=message||''}
  function tabs(container,items){container.innerHTML='<div class="tabs" role="tablist">'+items.map(function(x,i){return '<button role="tab" id="tab-'+esc(x.id)+'" aria-controls="panel-'+esc(x.id)+'" aria-selected="'+(i===0)+'">'+esc(x.label)+'</button>'}).join('')+'</div>'+items.map(function(x,i){return '<section class="tab-panel" role="tabpanel" id="panel-'+esc(x.id)+'" aria-labelledby="tab-'+esc(x.id)+'" '+(i?'hidden':'')+'>'+x.content+'</section>'}).join('');var buttons=container.querySelectorAll('[role=tab]');buttons.forEach(function(button,index){button.onclick=function(){buttons.forEach(function(b,j){var active=j===index;b.setAttribute('aria-selected',active);container.querySelector('#panel-'+items[j].id).hidden=!active})};button.onkeydown=function(e){if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var n=(index+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;buttons[n].focus();buttons[n].click()}}})}
  function modal(options){
    closeModal();lastFocus=document.activeElement;var layer=document.createElement('div');layer.id='modalLayer';layer.className='modal-layer';layer.innerHTML='<section class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><header class="modal-head"><h2 id="modalTitle">'+esc(options.title)+'</h2><button class="btn icon modal-close" aria-label="Đóng hộp thoại">×</button></header><div class="modal-body">'+(options.body||'')+'</div><footer class="modal-foot"><button class="btn" data-modal-cancel>Hủy</button><button class="btn '+(options.danger?'danger':'primary')+'" data-modal-ok>'+esc(options.confirmLabel||'Xác nhận')+'</button></footer></section>';document.body.appendChild(layer);
    var close=closeModal;layer.querySelector('.modal-close').onclick=close;layer.querySelector('[data-modal-cancel]').onclick=close;layer.querySelector('[data-modal-ok]').onclick=function(){if(!options.onConfirm||options.onConfirm()!==false)close()};layer.onclick=function(e){if(e.target===layer)close()};layer.onkeydown=function(e){if(e.key==='Escape')close();if(e.key==='Tab'){var f=layer.querySelectorAll('button,input,select,textarea,[href]'),first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}};layer.querySelector('.modal-close').focus();return layer;
  }
  function closeModal(){var layer=document.getElementById('modalLayer');if(layer)layer.remove();if(lastFocus&&lastFocus.focus)lastFocus.focus();lastFocus=null}
  function toast(options){options=typeof options==='string'?{message:options}:options||{};var region=document.getElementById('toastRegion');if(!region){region=document.createElement('div');region.id='toastRegion';region.className='toast-region';region.setAttribute('aria-live','polite');document.body.appendChild(region)}var el=document.createElement('div');el.className='toast '+(options.type||'success');el.setAttribute('role',options.type==='error'?'alert':'status');el.innerHTML='<div><strong>'+esc(options.title||'Thông báo')+'</strong><span>'+esc(options.message||'')+'</span></div>'+(options.action?'<button type="button">'+esc(options.action.label)+'</button>':'');if(options.action)el.querySelector('button').onclick=function(){el.remove();options.action.onClick()};region.appendChild(el);var duration=options.duration===undefined?3500:options.duration;if(duration>0)setTimeout(function(){el.remove()},duration);return el}
  root.MiniERP=root.MiniERP||{};root.MiniERP.ui={escape:esc,chip:chip,table:table,allocation:allocation,formField:formField,setFieldError:setFieldError,tabs:tabs,modal:modal,closeModal:closeModal,toast:toast};
})(window);
</script>
