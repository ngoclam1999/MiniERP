<script>
(function(){
'use strict';var oldRoute=route,rows=[],emps=[],seq=0;
function links(){[['stock','items','Vật tư','beforebegin'],['hr','employees','Hồ sơ nhân viên','afterend']].forEach(function(x){if(nav.querySelector('a[href="#'+x[1]+'"]'))return;var ref=nav.querySelector('a[href="#'+x[0]+'"]');if(ref){var a=document.createElement('a');a.href='#'+x[1];a.innerHTML=ICON+'<span>'+x[2]+'</span>';ref.insertAdjacentElement(x[3],a)}})}new MutationObserver(links).observe(nav,{childList:true});
route=function(){var p=(location.hash||'#dashboard').slice(1);if(p==='items'){itemsPage();active('#items','Vật tư')}else if(p==='employees'){employeesPage();active('#employees','Hồ sơ nhân viên')}else oldRoute()};addEventListener('hashchange',route);
function active(h,t){document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active',a.hash===h)});viewName.textContent=t}
function itemsPage(){var v=document.querySelector('main.content');v.dataset.page='items';v.innerHTML='<div class="head"><div><h1>Danh mục vật tư</h1><p>Quản lý SKU, mã vạch và thông tin kho.</p></div><div class="catalog-actions"><button class="btn" id="importBtn">Nhập Excel / CSV</button><button class="btn primary" id="addBtn">Thêm vật tư</button></div></div><section class="card component-block"><div class="catalog-toolbar"><div class="field catalog-search"><label for="q">Tìm kiếm hoặc quét mã</label><input id="q" type="search" placeholder="SKU, tên, mã vạch…"></div><span id="count" class="label">Đang tải…</span></div><div id="tbl"><div class="sk"></div></div></section>';q.oninput=function(){loadItems(q.value)};addBtn.onclick=function(){itemForm()};importBtn.onclick=importForm;tbl.onclick=function(e){var b=e.target.closest('[data-sku]');if(b)itemForm(rows.find(function(r){return r.sku===b.dataset.sku}))};loadItems('')}
function loadItems(s){var n=++seq;MiniERP.api.call('item.list',{search:s||''},{silent:true}).then(function(r){if(n!==seq)return;rows=r.data||[];count.textContent=rows.length+' vật tư';tbl.innerHTML=MiniERP.ui.table({columns:[{key:'sku',label:'SKU'},{key:'name',label:'Tên vật tư'},{key:'category',label:'Nhóm'},{key:'unit',label:'ĐVT'},{key:'barcode',label:'Mã vạch'},{key:'x',label:'',render:function(x){return '<button class="btn" data-sku="'+MiniERP.ui.escape(x.sku)+'">Sửa</button>'}}],rows:rows,emptyText:'Chưa có vật tư'})})}
var itemFields=[['sku','SKU',1],['name','Tên vật tư',1],['category','Nhóm'],['unit','Đơn vị',1],['spec','Thông số'],['min_stock','Tồn tối thiểu'],['default_sup_id','NCC mặc định'],['lead_time_days','Lead-time'],['avg_cost_vnd','Giá vốn TB'],['wh_type','Loại kho',1],['barcode','Mã vạch']];
function fields(list,row){return '<form id="catalogForm" class="partner-form">'+list.map(function(f){return '<div class="field"><label>'+f[1]+'</label><input data-f="'+f[0]+'" '+(f[2]?'required':'')+' '+(row&&f[0]==='sku'?'disabled':'')+' value="'+MiniERP.ui.escape(row&&row[f[0]]||'')+'"><div class="field-error"></div></div>'}).join('')+'</form>'}
function values(){var out={},ok=true;catalogForm.querySelectorAll('[data-f]').forEach(function(i){out[i.dataset.f]=i.value.trim();var e=i.required&&!out[i.dataset.f]?'Không được để trống.':'';i.nextElementSibling.textContent=e;if(e)ok=false});return ok?out:null}
function itemForm(row){MiniERP.ui.modal({title:row?'Sửa vật tư':'Thêm vật tư',body:fields(itemFields,row),confirmLabel:'Lưu',onConfirm:function(){var x=values();if(!x)return false;var p=x,a='item.create';if(row){delete x.sku;p={sku:row.sku,patch:x};a='item.update'}MiniERP.api.call(a,p).then(function(){MiniERP.ui.closeModal();loadItems(q.value)});return false}})}
function parse(text){var ls=String(text||'').trim().split(/\r?\n/),d=ls[0]&&ls[0].indexOf('\t')>=0?'\t':',';if(ls.length<2)return[];var h=ls.shift().split(d).map(function(x){return x.trim().replace(/^"|"$/g,'')});return ls.filter(Boolean).map(function(l){var c=l.split(d),o={};h.forEach(function(k,i){o[k]=(c[i]||'').trim().replace(/^"|"$/g,'')});return o})}
function importForm(){MiniERP.ui.modal({title:'Nhập vật tư hàng loạt',body:'<p class="label">Dán bảng từ Excel hoặc chọn file CSV. Hàng đầu là tên cột Items.</p><div class="field"><label>File CSV</label><input id="file" type="file" accept=".csv,text/csv"></div><div class="field"><label>Dữ liệu Excel / CSV</label><textarea id="paste" rows="9"></textarea></div><div id="errs" class="import-errors" aria-live="polite"></div>',confirmLabel:'Kiểm tra và nhập',onConfirm:function(){var data=parse(paste.value);MiniERP.api.call('item.import_preview',{rows:data}).then(function(r){if(r.data.errors.length){errs.innerHTML=r.data.errors.map(function(e){return 'Dòng '+e.row+': '+MiniERP.ui.escape(e.message)}).join('<br>');return}MiniERP.api.call('item.import_commit',{rows:r.data.valid_rows}).then(function(x){MiniERP.ui.closeModal();MiniERP.ui.toast({type:'success',title:'Đã nhập',message:x.data.created+' vật tư.'});loadItems('')})});return false}});file.onchange=function(){var f=this.files[0],rd=new FileReader();if(f){rd.onload=function(){paste.value=rd.result};rd.readAsText(f,'UTF-8')}}}
function employeesPage(){var v=document.querySelector('main.content');v.dataset.page='employees';v.innerHTML='<div class="head"><div><h1>Hồ sơ nhân viên</h1><p>Dữ liệu nhạy cảm được kiểm soát theo vai trò.</p></div><button class="btn primary" id="addEmp">Thêm nhân viên</button></div><div class="split-layout"><section class="card component-block"><div class="field catalog-search"><label for="eq">Tìm nhân viên</label><input id="eq" type="search" placeholder="Mã, tên, phòng ban…"></div><div id="etbl"><div class="sk"></div></div></section><aside class="card detail-card" id="detail"><div class="empty-view">Chọn nhân viên để xem chi tiết.</div></aside></div>';addEmp.onclick=function(){empForm()};eq.oninput=empTable;etbl.onclick=function(e){var tr=e.target.closest('[data-emp]');if(tr)empDetail(tr.dataset.emp)};MiniERP.api.call('employee.list',{}, {silent:true}).then(function(r){emps=r.data||[];empTable()})}
function empTable(){var t=(eq.value||'').toLowerCase(),a=emps.filter(function(x){return [x.emp_id,x.full_name,x.dept,x.position].join(' ').toLowerCase().indexOf(t)>=0});etbl.innerHTML=MiniERP.ui.table({columns:[{key:'emp_id',label:'Mã'},{key:'full_name',label:'Họ tên'},{key:'dept',label:'Phòng ban'},{key:'position',label:'Chức vụ'}],rows:a,emptyText:'Chưa có nhân viên'});etbl.querySelectorAll('tbody tr').forEach(function(tr,i){if(a[i]){tr.dataset.emp=a[i].emp_id;tr.tabIndex=0;tr.style.cursor='pointer'}})}
function empDetail(id){MiniERP.api.call('employee.get',{emp_id:id}).then(function(r){var x=r.data,fs=[['emp_id','Mã'],['full_name','Họ tên'],['dept','Phòng ban'],['position','Chức vụ'],['phone','Điện thoại'],['id_card_no','CCCD'],['bank_account','Số tài khoản'],['status','Trạng thái']];detail.innerHTML='<div class="title"><h2>Chi tiết</h2><button class="btn" id="editEmp">Sửa</button></div><div class="detail-grid">'+fs.map(function(f){return '<div class="detail-item"><span>'+f[1]+'</span><b>'+MiniERP.ui.escape(x[f[0]]||'—')+'</b></div>'}).join('')+'</div>';editEmp.onclick=function(){empForm(x)}})}
var empFields=[['emp_id','Mã nhân viên',1],['full_name','Họ tên',1],['dept','Phòng ban'],['position','Chức vụ'],['phone','Điện thoại'],['bank_name','Ngân hàng'],['bank_account','Số tài khoản'],['id_card_no','CCCD'],['tax_code','Mã số thuế'],['status','Trạng thái']];
function empForm(row){MiniERP.ui.modal({title:row?'Sửa nhân viên':'Thêm nhân viên',body:fields(empFields,row),confirmLabel:'Lưu',onConfirm:function(){var x=values();if(!x)return false;var s={id_card_no:x.id_card_no,tax_code:x.tax_code};delete x.id_card_no;delete x.tax_code;var a=row?'employee.update':'employee.create',p=row?{emp_id:row.emp_id,patch:x,sensitive:s}:{employee:x,sensitive:s};MiniERP.api.call(a,p).then(function(){MiniERP.ui.closeModal();employeesPage()});return false}})}
})();
</script>
