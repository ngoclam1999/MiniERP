<script>
(function(){'use strict';var prior=route,projects=[],selected=null;
route=function(){var p=(location.hash||'#dashboard').slice(1);if(p==='projects'){renderProjects();document.querySelectorAll('.nav a').forEach(function(a){a.classList.toggle('active',a.hash==='#projects')});viewName.textContent='Dự án'}else prior()};addEventListener('hashchange',function(){route()});
function renderProjects(){var v=document.querySelector('main.content');v.dataset.page='projects';v.innerHTML='<div class="head"><div><h1>Dự án</h1><p>Hồ sơ, tiến độ và kế hoạch thanh toán.</p></div><button class="btn primary" id="newProject">Tạo dự án</button></div><div class="split-layout"><section class="card component-block"><div id="projectCards"><div class="sk"></div></div></section><section class="card detail-card" id="projectDetail"><div class="empty-view">Chọn dự án để xem chi tiết.</div></section></div>';var listEl=document.getElementById('projectCards');document.getElementById('newProject').onclick=function(){projectForm()};listEl.onclick=function(e){var x=e.target.closest('[data-project]');if(x)loadDetail(x.dataset.project)};MiniERP.api.call('project.list',{}, {silent:true}).then(function(r){projects=r.data||[];listEl.innerHTML=MiniERP.ui.table({columns:[{key:'project_id',label:'Mã'},{key:'name',label:'Tên dự án'},{key:'progress_pct',label:'Tiến độ',numeric:true},{key:'status',label:'Trạng thái'}],rows:projects,emptyText:'Chưa có dự án'});listEl.querySelectorAll('tbody tr').forEach(function(tr,i){if(projects[i]){tr.dataset.project=projects[i].project_id;tr.tabIndex=0;tr.style.cursor='pointer'}})}).catch(function(e){listEl.innerHTML='<div class="empty-view">'+MiniERP.ui.escape(e.message||'Không thể tải dự án.')+'</div>'})}
function loadDetail(id){MiniERP.api.call('project.get',{project_id:id}).then(function(r){selected=r.data;var pay=MiniERP.ui.table({columns:[{key:'seq',label:'#'},{key:'name',label:'Đợt'},{key:'percent',label:'Tỷ lệ',numeric:true},{key:'amount_vnd',label:'Số tiền',numeric:true},{key:'status',label:'Trạng thái'}],rows:selected.payments||[]}),detailEl=document.getElementById('projectDetail');detailEl.innerHTML='<div class="title"><h2>'+MiniERP.ui.escape(selected.name)+'</h2><button class="btn" id="editProject">Sửa</button></div><div id="projectTabs"></div>';MiniERP.ui.tabs(document.getElementById('projectTabs'),[{id:'profile',label:'Hồ sơ',content:'<div class="detail-grid">'+detail('Mã',selected.project_id)+detail('Khách hàng',selected.cust_id)+detail('QLDA',selected.pm_emp_id)+detail('Thời gian',selected.start_date+' → '+selected.due_date)+detail('Tiến độ',selected.progress_pct+'%')+detail('Trạng thái',selected.status)+'</div>'},{id:'bom',label:'BOM & Vật tư',content:'<div class="catalog-actions"><button class="btn primary" id="addBom">Thêm dòng</button><button class="btn" id="importBom">Nhập Excel / CSV</button></div><div id="bomTable" style="margin-top:12px"></div>'},{id:'tasks',label:'Công việc',content:'<p class="label">'+(selected.tasks||[]).length+' công việc.</p>'},{id:'payments',label:'Thanh toán',content:pay+'<button class="btn" id="editPlan">Sửa kế hoạch</button>'},{id:'cost',label:'Giá thành',content:'<div id="costSummary"><div class="sk"></div></div>'}]);document.getElementById('editProject').onclick=function(){projectForm(selected)};var b=document.getElementById('editPlan');if(b)b.onclick=paymentForm;document.getElementById('addBom').onclick=function(){bomForm()};document.getElementById('importBom').onclick=bomImport;loadBomTab();loadCostTab()})}
function detail(k,v){return '<div class="detail-item"><span>'+k+'</span><b>'+MiniERP.ui.escape(v||'—')+'</b></div>'}
var pf=[['name','Tên dự án',1],['cust_id','Mã khách hàng',1],['contract_value_vnd','Giá trị hợp đồng',1],['start_date','Ngày bắt đầu',1,'date'],['due_date','Ngày kết thúc',1,'date'],['pm_emp_id','Mã QLDA',1],['budget_vnd','Ngân sách'],['status','Trạng thái'],['note','Ghi chú']];
function projectForm(row){Promise.all([MiniERP.api.call('customer.list',{}, {silent:true}),MiniERP.api.call('employee.list',{}, {silent:true})]).then(function(r){var customers=r[0].data||[],employees=r[1].data||[],body='<form id="projectEditor" class="partner-form">';pf.forEach(function(f){var value=row&&row[f[0]]||'';body+='<div class="field"><label>'+f[1]+'</label>';if(f[0]==='cust_id')body+='<select data-f="cust_id" required><option value="">Chọn khách hàng</option>'+customers.map(function(x){return'<option value="'+MiniERP.ui.escape(x.cust_id)+'" '+(String(value)===String(x.cust_id)?'selected':'')+'>'+MiniERP.ui.escape(x.cust_id+' · '+x.name)+'</option>'}).join('')+'</select><a class="link" href="#customers">Không có? Tạo khách hàng trước</a>';else if(f[0]==='pm_emp_id')body+='<select data-f="pm_emp_id" required><option value="">Chọn QLDA</option>'+employees.map(function(x){return'<option value="'+MiniERP.ui.escape(x.emp_id)+'" '+(String(value)===String(x.emp_id)?'selected':'')+'>'+MiniERP.ui.escape(x.emp_id+' · '+x.full_name)+'</option>'}).join('')+'</select><a class="link" href="#employees">Không có? Tạo nhân viên trước</a>';else body+='<input data-f="'+f[0]+'" type="'+(f[3]||'text')+'" '+(f[2]?'required':'')+' value="'+MiniERP.ui.escape(value)+'">';body+='<div class="field-error"></div></div>'});body+='</form>';MiniERP.ui.modal({title:row?'Sửa dự án':'Tạo dự án',body:body,confirmLabel:'Lưu',onConfirm:function(){var x={},ok=true;document.getElementById('projectEditor').querySelectorAll('[data-f]').forEach(function(i){x[i.dataset.f]=i.value.trim();var e=i.required&&!x[i.dataset.f]?'Không được để trống.':'';i.parentElement.querySelector('.field-error').textContent=e;if(e)ok=false});if(!ok)return false;var a=row?'project.update':'project.create',p=row?{project_id:row.project_id,patch:x}:x;MiniERP.api.call(a,p).then(function(){MiniERP.ui.closeModal();renderProjects()});return false}})})}
function paymentForm(){var lines=selected.payments||[];MiniERP.ui.modal({title:'Kế hoạch thanh toán',body:'<form id="paymentEditor">'+lines.map(function(x,i){return '<div class="partner-form"><div class="field"><label>Tên đợt '+(i+1)+'</label><input data-name="'+i+'" value="'+MiniERP.ui.escape(x.name)+'"></div><div class="field"><label>Tỷ lệ %</label><input type="number" data-percent="'+i+'" value="'+x.percent+'"><div class="field-error"></div></div></div>'}).join('')+'<div id="payError" class="field-error"></div></form>',confirmLabel:'Cập nhật',onConfirm:function(){var form=document.getElementById('paymentEditor'),out=lines.map(function(x,i){return{pay_id:x.pay_id,name:form.querySelector('[data-name="'+i+'"]').value,percent:Number(form.querySelector('[data-percent="'+i+'"]').value),due_date:x.due_date||''}}),sum=out.reduce(function(s,x){return s+x.percent},0);document.getElementById('payError').textContent=sum===100?'':'Tổng tỷ lệ phải bằng 100%.';if(sum!==100)return false;MiniERP.api.call('payment.update_plan',{project_id:selected.project_id,lines:out}).then(function(){MiniERP.ui.closeModal();loadDetail(selected.project_id)});return false}})}
function loadBomTab(){MiniERP.api.call('bom.list',{project_id:selected.project_id},{silent:true}).then(function(r){var rows=r.data||[],labels={issued:'Đã xuất đủ',short:'Thiếu',ordered:'Đang đặt mua',reserved:'Đã giữ chỗ'};document.getElementById('bomTable').innerHTML=MiniERP.ui.table({columns:[{key:'sku',label:'SKU'},{key:'qty_required',label:'Yêu cầu',numeric:true},{key:'need_date',label:'Ngày cần'},{key:'state',label:'Trạng thái',render:function(x){return MiniERP.ui.chip(labels[x.state]||x.state,x.state==='issued'?'good':x.state==='short'?'bad':'info')}},{key:'allocation',label:'Phân bổ',render:function(x){return MiniERP.ui.allocation({required:x.qty_short,reserved:x.qty_reserved,ordered:x.qty_ordered,issued:x.qty_issued},'Phân bổ '+x.sku)}}],rows:rows,emptyText:'Chưa có BOM'})})}
function bomForm(){MiniERP.api.call('item.list',{}, {silent:true}).then(function(r){var items=r.data||[],options=items.map(function(x){return'<option value="'+MiniERP.ui.escape(x.sku)+'">'+MiniERP.ui.escape(x.sku+' · '+x.name)+'</option>'}).join('');MiniERP.ui.modal({title:'Thêm dòng BOM',body:'<div class="field"><label>Vật tư</label><select id="bomSku"><option value="">Chọn SKU</option>'+options+'</select><a class="link" href="#items">Không có? Tạo vật tư trước</a></div><div class="field"><label>Số lượng yêu cầu</label><input id="bomQty" type="number" min="0.001" step="any"></div><div class="field"><label>Ngày cần</label><input id="bomNeed" type="date"></div><div class="field"><label>Ghi chú</label><input id="bomNote"></div>',confirmLabel:'Thêm',onConfirm:function(){MiniERP.api.call('bom.add_line',{project_id:selected.project_id,sku:document.getElementById('bomSku').value,qty_required:document.getElementById('bomQty').value,need_date:document.getElementById('bomNeed').value,note:document.getElementById('bomNote').value}).then(function(){MiniERP.ui.closeModal();loadBomTab();loadCostTab()});return false}})})}
function parseBom(text){var ls=String(text||'').trim().split(/\r?\n/),d=ls[0]&&ls[0].indexOf('\t')>=0?'\t':',';if(ls.length<2)return[];var h=ls.shift().split(d).map(function(x){return x.trim()});return ls.filter(Boolean).map(function(l){var c=l.split(d),o={};h.forEach(function(k,i){o[k]=(c[i]||'').trim()});return o})}
function bomImport(){MiniERP.ui.modal({title:'Nhập BOM',body:'<p class="label">Dán từ Excel/CSV: sku, qty_required, need_date, note.</p><div class="field"><label>Dữ liệu</label><textarea id="bomPaste" rows="9"></textarea></div><div class="field"><label>Dòng trùng</label><select id="dupMode"><option value="sum">Cộng dồn</option><option value="skip">Bỏ qua</option></select></div><div id="bomErrors" class="import-errors"></div>',confirmLabel:'Xem trước và nhập',onConfirm:function(){var rows=parseBom(bomPaste.value),mode=dupMode.value;MiniERP.api.call('bom.import_preview',{rows:rows,duplicate_mode:mode}).then(function(r){if(r.data.errors.length){bomErrors.innerHTML=r.data.errors.map(function(e){return'Dòng '+e.row+': '+MiniERP.ui.escape(e.message)}).join('<br>');return}MiniERP.api.call('bom.import_commit',{project_id:selected.project_id,rows:r.data.valid_rows,duplicate_mode:mode}).then(function(){MiniERP.ui.closeModal();loadBomTab();loadCostTab()})});return false}})}
function loadCostTab(){MiniERP.api.call('project.cost',{project_id:selected.project_id},{silent:true}).then(function(r){var x=r.data;document.getElementById('costSummary').innerHTML='<div class="detail-grid">'+detail('Vật tư',x.material.toLocaleString('vi-VN')+' ₫')+detail('OT',x.ot.toLocaleString('vi-VN')+' ₫')+detail('Công tác',x.trip.toLocaleString('vi-VN')+' ₫')+detail('Khác',x.other.toLocaleString('vi-VN')+' ₫')+detail('Cam kết',x.committed.toLocaleString('vi-VN')+' ₫')+detail('Biên gộp',x.gross_margin.toLocaleString('vi-VN')+' ₫')+'</div>'})}
})();
</script>
